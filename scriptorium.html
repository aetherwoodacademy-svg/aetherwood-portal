<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#14111b" />
<title>The Scriptorium · Aetherwood</title>

<!--
  ============================================================
  THE SCRIPTORIUM — private writing-state desk.
  Same pattern as keeper-console.html: NO key lives here.
  It gates on the Keeper's word and reads/writes through the
  Netlify function, which holds the Supabase key server-side.

  COWORK — the only thing left to build is ONE action on
  /.netlify/functions/keeper:

    GET  ?action=scriptorium
         (header x-keeper-token)
         -> returns the saved board as JSON.
            Either { "board": {...} }  or the board object itself.
            Return null / {} / { "board": null } if nothing saved yet.

    POST ?action=scriptorium
         (header x-keeper-token, body { "board": {...} })
         -> persists the board (one JSON row/blob in Supabase,
            using the key the function already holds).

  Until that action exists, this page falls back to this device's
  localStorage so it stays fully usable, and says so in a banner.
  ============================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />

<style>
  :root {
    --ink: #ece3d4;
    --ink-dim: #b9ad98;
    --ink-faint: #7d7361;
    --stone-0: #14111b;
    --stone-1: #191521;
    --stone-2: #201a2b;
    --stone-edge: #2e2740;
    --gold: #d9a84e;
    --gold-faint: #6e5a30;
    --warm: #e2a44e;
    --warm-glow: rgba(226,164,78,0.16);
    --cool: #b5764f;
    --cold: #6f7d95;
    --moon: #b9a9d6;
    --red: #d98a8a;
    --shadow: rgba(0,0,0,0.5);
    --caps: "Cinzel", serif;
    --serif: "Cormorant Garamond", Georgia, serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    font-family: var(--serif);
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 50% -8%, rgba(226,164,78,0.10), transparent 60%),
      radial-gradient(900px 500px at 85% 110%, rgba(120,90,160,0.10), transparent 55%),
      linear-gradient(180deg, var(--stone-1), var(--stone-0));
    min-height: 100vh;
    padding: clamp(18px, 4vw, 48px);
    -webkit-font-smoothing: antialiased;
  }

  .hidden-el { display: none !important; }

  /* ---- Keeper's Door gate ---- */
  #gate { position: fixed; inset: 0; z-index: 50;
    background:
      radial-gradient(800px 400px at 50% 0%, rgba(226,164,78,0.08), transparent 60%),
      linear-gradient(180deg, var(--stone-1), var(--stone-0));
    display: flex; align-items: center; justify-content: center; padding: 24px; }
  #gate .box {
    background: linear-gradient(180deg, var(--stone-2), var(--stone-1));
    border: 1px solid var(--gold-faint); border-radius: 4px;
    padding: 34px 30px; width: min(380px, 92vw); text-align: center;
    box-shadow: 0 24px 60px -30px var(--shadow); }
  #gate h2 { font-family: var(--caps); font-weight: 500; color: var(--gold);
    letter-spacing: 0.1em; font-size: 1.25rem; margin: 0 0 0.5rem; }
  #gate p { color: var(--ink-dim); font-style: italic; font-size: 1.02rem; margin: 0 0 18px; }
  #gate input[type=password] { width: 100%; padding: 11px 12px; border-radius: 3px;
    border: 1px solid var(--stone-edge); background: var(--stone-0); color: var(--ink);
    font-family: var(--serif); font-size: 1.05rem; margin-bottom: 12px; }
  #gate input:focus { outline: none; border-color: var(--gold); }
  #gate .remember { display: flex; gap: 8px; align-items: center; justify-content: center;
    color: var(--ink-faint); font-size: 0.9rem; margin: 2px 0 14px; cursor: pointer; }
  #gate button { width: 100%; padding: 11px; border-radius: 3px; cursor: pointer;
    border: 1px solid var(--gold-faint); background: rgba(226,164,78,0.12); color: var(--gold);
    font-family: var(--caps); letter-spacing: 0.1em; font-size: 0.95rem; }
  #gate button:hover { background: rgba(226,164,78,0.2); }
  #gate button:disabled { opacity: 0.5; cursor: wait; }
  #gate .err { color: var(--red); font-style: italic; font-size: 0.9rem; margin-top: 12px; min-height: 1.1em; }

  /* ---- Masthead ---- */
  .mast { max-width: 1180px; margin: 0 auto clamp(18px, 3vw, 30px); text-align: center; position: relative; }
  .eyebrow { font-family: var(--caps); font-size: 0.72rem; letter-spacing: 0.34em; text-transform: uppercase;
    color: var(--gold); opacity: 0.85; margin: 0 0 0.5rem; padding-left: 0.34em; }
  .mast h1 { font-weight: 500; font-size: clamp(2.2rem, 5.4vw, 3.6rem); line-height: 1.02; margin: 0; }
  .mast .sub { font-style: italic; color: var(--ink-dim); font-size: clamp(1rem, 2vw, 1.2rem); margin: 0.5rem 0 0; }

  /* ---- banner (mode / sync) ---- */
  .banner { max-width: 1180px; margin: 0 auto clamp(14px, 2vw, 22px);
    border: 1px solid var(--gold-faint); border-radius: 3px;
    background: linear-gradient(180deg, rgba(226,164,78,0.08), rgba(0,0,0,0.10));
    padding: 11px 16px; font-size: 0.98rem; color: var(--ink-dim);
    display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .banner .msg { font-style: italic; }
  .banner button { font-family: var(--serif); background: transparent; color: var(--gold);
    border: 1px solid var(--gold-faint); border-radius: 3px; padding: 5px 12px; cursor: pointer;
    font-size: 0.92rem; white-space: nowrap; }
  .banner button:hover { background: rgba(226,164,78,0.1); }

  /* ---- Pick up here ---- */
  .hearth { max-width: 1180px; margin: 0 auto clamp(20px, 3vw, 34px); position: relative;
    border: 1px solid var(--gold-faint); border-radius: 3px;
    background:
      radial-gradient(600px 200px at 50% -40%, var(--warm-glow), transparent 70%),
      linear-gradient(180deg, rgba(226,164,78,0.05), rgba(0,0,0,0.14));
    padding: clamp(18px, 3vw, 30px) clamp(20px, 4vw, 40px); overflow: hidden;
    box-shadow: 0 1px 0 rgba(226,164,78,0.15) inset, 0 18px 40px -28px var(--shadow); }
  .hearth::before { content: ""; position: absolute; inset: 0;
    background: radial-gradient(240px 120px at 12% 0%, var(--warm-glow), transparent 70%);
    animation: flicker 5.5s ease-in-out infinite; pointer-events: none; }
  @keyframes flicker { 0%,100% { opacity: 0.85; } 45% { opacity: 1; } 60% { opacity: 0.7; } 72% { opacity: 0.95; } }
  .hearth .label { font-family: var(--caps); font-size: 0.68rem; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--warm); margin: 0 0 0.55rem; position: relative; }
  .hearth .pu-title { font-size: clamp(1.5rem, 3.6vw, 2.15rem); font-weight: 500; line-height: 1.1; margin: 0; position: relative; }
  .hearth .pu-kind { font-size: 0.9em; color: var(--warm); margin-right: 0.4rem; opacity: 0.85; }
  .hearth .pu-next { font-style: italic; font-size: clamp(1.05rem, 2.3vw, 1.35rem); color: var(--ink-dim);
    margin: 0.6rem 0 0; position: relative; max-width: 62ch; }
  .hearth .pu-empty { font-style: italic; color: var(--ink-faint); }

  /* ---- Board ---- */
  .board { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr);
    gap: clamp(12px, 1.6vw, 20px); align-items: start; }
  @media (max-width: 1080px) { .board { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 620px)  { .board { grid-template-columns: 1fr; } }

  .lane { background: linear-gradient(180deg, var(--stone-2), var(--stone-1));
    border: 1px solid var(--stone-edge); border-radius: 4px; padding: 14px 12px 16px; min-height: 120px; }
  .lane[data-lane="warm"]    { border-top: 2px solid var(--warm); }
  .lane[data-lane="cooling"] { border-top: 2px solid var(--cool); }
  .lane[data-lane="cold"]    { border-top: 2px solid var(--cold); }
  .lane[data-lane="seeds"]   { border-top: 2px solid var(--moon); }

  .lane-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 2px 4px 12px; }
  .lane-head h2 { font-size: 1.16rem; font-weight: 600; margin: 0; letter-spacing: 0.02em; }
  .lane[data-lane="warm"]    .lane-head h2 { color: var(--warm); }
  .lane[data-lane="cooling"] .lane-head h2 { color: var(--cool); }
  .lane[data-lane="cold"]    .lane-head h2 { color: var(--cold); }
  .lane[data-lane="seeds"]   .lane-head h2 { color: var(--moon); }
  .lane-head .whisper { font-style: italic; font-size: 0.82rem; color: var(--ink-faint); }

  .card { background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(0,0,0,0.16));
    border: 1px solid var(--stone-edge); border-radius: 3px; padding: 11px 12px 10px; margin-bottom: 10px;
    box-shadow: 0 8px 18px -16px var(--shadow); }
  .card:last-child { margin-bottom: 0; }
  .card .kind { font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-faint);
    display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.35rem; }
  .card .kind .glyph { font-size: 1rem; letter-spacing: 0; }
  .card h3 { font-size: 1.14rem; font-weight: 500; line-height: 1.15; margin: 0; }
  .card .next { font-style: italic; color: var(--ink-dim); font-size: 1rem; margin: 0.35rem 0 0; line-height: 1.28; }
  .card .next::before { content: "\21B3 "; color: var(--ink-faint); font-style: normal; }

  .card .row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.05); }
  button.mini { font-family: inherit; cursor: pointer; background: transparent; color: var(--ink-faint);
    border: 1px solid transparent; border-radius: 3px; padding: 3px 7px; font-size: 0.86rem;
    transition: color .15s, border-color .15s, background .15s; }
  button.mini:hover { color: var(--ink); border-color: var(--gold-faint); background: rgba(226,164,78,0.06); }
  button.mini:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  button.warmer:hover { color: var(--warm); }
  button.cooler:hover { color: var(--cold); }
  button.del:hover { color: var(--red); border-color: #6e3030; background: rgba(200,80,80,0.08); }
  .spacer { flex: 1; }

  .add { width: 100%; text-align: left; color: var(--ink-faint); font-family: inherit; cursor: pointer;
    border: 1px dashed var(--stone-edge); border-radius: 3px; background: transparent;
    padding: 8px 10px; margin-top: 4px; font-style: italic; font-size: 0.96rem; }
  .add:hover { color: var(--ink-dim); border-color: var(--gold-faint); }

  .editor input, .editor textarea, .editor select { width: 100%; font-family: inherit; font-size: 1rem;
    background: var(--stone-0); color: var(--ink); border: 1px solid var(--stone-edge); border-radius: 3px;
    padding: 7px 9px; margin-bottom: 7px; }
  .editor textarea { font-style: italic; resize: vertical; min-height: 44px; }
  .editor input:focus, .editor textarea:focus, .editor select:focus { outline: none; border-color: var(--gold); }
  .editor .erow { display: flex; gap: 6px; }
  .editor .save { color: var(--gold); border-color: var(--gold-faint); }
  .editor .save:hover { background: rgba(226,164,78,0.1); color: var(--warm); }

  .foot { max-width: 1180px; margin: clamp(24px,3vw,36px) auto 0; display: flex; justify-content: space-between;
    align-items: center; gap: 12px; flex-wrap: wrap; font-size: 0.86rem; color: var(--ink-faint);
    font-style: italic; border-top: 1px solid var(--stone-edge); padding-top: 14px; }
  .foot .legend span { margin-right: 1rem; white-space: nowrap; }
  .foot .tools { display: flex; gap: 10px; align-items: center; }
  .foot button { font-family: inherit; font-style: normal; cursor: pointer; background: transparent;
    color: var(--ink-faint); border: 1px solid var(--stone-edge); border-radius: 3px; padding: 4px 10px; font-size: 0.84rem; }
  .foot button:hover { color: var(--ink); border-color: var(--gold-faint); }
  #saveNote { font-style: italic; color: var(--ink-faint); }

  @media (prefers-reduced-motion: reduce) { .hearth::before { animation: none; } }
  #app { position: relative; z-index: 1; }
  .motes { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .mote { position: absolute; bottom: -14px; border-radius: 50%;
    background: rgba(232,196,116,0.85);
    box-shadow: 0 0 7px 2px rgba(224,180,96,0.5), 0 0 14px 4px rgba(150,120,220,0.18);
    animation: mrise linear infinite, mtwinkle ease-in-out infinite; opacity: 0; }
  @keyframes mrise { 0% { transform: translateY(0) translateX(0); } 100% { transform: translateY(-108vh) translateX(var(--drift,24px)); } }
  @keyframes mtwinkle { 0%,100% { opacity: 0; } 12% { opacity: 0.9; } 50% { opacity: 0.55; } 88% { opacity: 0.85; } }
  #saveNote.settled { color: var(--gold); }
  #saveNote.pulse { animation: noteGlow 1.1s ease-out; }
  @keyframes noteGlow { 0% { text-shadow: 0 0 10px rgba(226,164,78,0.75); } 100% { text-shadow: 0 0 0 rgba(226,164,78,0); } }
  @media (prefers-reduced-motion: reduce) { .motes { display: none; } }
</style>
</head>
<body>

  <div class="motes" id="motes" aria-hidden="true"></div>

  <!-- ===== The Keeper's Door ===== -->
  <div id="gate">
    <div class="box">
      <h2>The Keeper's Door</h2>
      <p>Speak the word to enter the Scriptorium.</p>
      <input id="pw" type="password" placeholder="Keeper's word" autocomplete="off" />
      <label class="remember"><input type="checkbox" id="remember" checked /> Remember me on this device</label>
      <button id="enter">Enter</button>
      <div class="err" id="gateErr"></div>
    </div>
  </div>

  <!-- ===== The desk ===== -->
  <div id="app" class="hidden-el">
    <div class="mast">
      <p class="eyebrow">Aetherwood</p>
      <h1>The Scriptorium</h1>
      <p class="sub">what is warm · what is next</p>
    </div>

    <div class="banner hidden-el" id="banner">
      <span class="msg" id="bannerMsg"></span>
      <button class="hidden-el" id="bannerAction"></button>
    </div>

    <section class="hearth" aria-live="polite">
      <p class="label">Pick up here</p>
      <div id="pickup"><p class="pu-empty">Lighting the candle…</p></div>
    </section>

    <main class="board" id="board"></main>

    <div class="foot">
      <div class="legend">
        <span>☾ poem</span><span>✍ prose</span><span>◈ canon</span><span>⬡ build</span><span>⬆ upload</span>
      </div>
      <div class="tools">
        <span id="saveNote"></span>
        <button id="reset" title="Clear every thread from the desk">Clear the desk</button>
        <button id="forget" title="Forget the Keeper's word on this device">Forget this device</button>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  // ---- backend (matches keeper-console.html) ----
  var API = "/.netlify/functions/keeper";
  var ACTION = "scriptorium";
  var WORD_KEY = "keeper_word";                 // shared with the console
  var LOCAL_BOARD_KEY = "aetherwood_scriptorium_board"; // fallback only
  var TOKEN = "";
  var localMode = false;                         // true when the function isn't reachable yet

  var LANES = ["warm", "cooling", "cold", "seeds"];
  var LANE_META = {
    warm:    { title: "Warm", whisper: "alive this week" },
    cooling: { title: "Cooling", whisper: "started, waiting" },
    cold:    { title: "Cold & Queued", whisper: "needed, not begun" },
    seeds:   { title: "Poem-Seeds", whisper: "fragments as they arrive" }
  };
  var KINDS = {
    poem:   { glyph: "☾", label: "poem" },
    prose:  { glyph: "✍", label: "prose" },
    canon:  { glyph: "◈", label: "canon" },
    build:  { glyph: "⬡", label: "build" },
    upload: { glyph: "⬆", label: "upload" }
  };

  function uid() { return "c" + Math.random().toString(36).slice(2, 9); }

  // The desk opens empty. The first words in it are yours.
  function seed() {
    return { warm: [], cooling: [], cold: [], seeds: [] };
  }

  // A board is valid if it has the four lanes as arrays.
  function isBoard(b) {
    return b && typeof b === "object" && LANES.every(function (l) { return Array.isArray(b[l]); });
  }
  // Accept { board: {...} } or the board object itself; else null.
  function normalize(data) {
    if (!data) return null;
    if (isBoard(data.board)) return data.board;
    if (isBoard(data)) return data;
    return null;
  }

  var state = null;
  var editing = null;

  // ---------- local fallback ----------
  function loadLocal() {
    try { var raw = localStorage.getItem(LOCAL_BOARD_KEY); return raw ? normalize(JSON.parse(raw)) : null; }
    catch (e) { return null; }
  }
  function saveLocal(board) {
    try { localStorage.setItem(LOCAL_BOARD_KEY, JSON.stringify(board)); } catch (e) {}
  }

  // ---------- function-backed store ----------
  // Throws Error("unauthorised") on 401/403; throws Error("unreachable") otherwise.
  async function fetchBoard() {
    var res = await fetch(API + "?action=" + ACTION, {
      headers: { "x-keeper-token": TOKEN, "Content-Type": "application/json" }
    });
    if (res.status === 401 || res.status === 403) throw new Error("unauthorised");
    if (!res.ok) throw new Error("unreachable");
    return normalize(await res.json());
  }
  async function pushBoard(board, keepalive) {
    var res = await fetch(API + "?action=" + ACTION, {
      method: "POST",
      headers: { "x-keeper-token": TOKEN, "Content-Type": "application/json" },
      body: JSON.stringify({ board: board }),
      keepalive: keepalive === true    // let the save finish even as the page closes
    });
    if (!res.ok) throw new Error("save-failed");
  }

  // ---------- save (mode-aware) ----------
  var saveTimer = null;
  var dirty = false;               // an edit is waiting to reach the store
  function commit() {
    render();
    saveNote("Saving…");
    if (localMode) { saveLocal(state); saveNote("Saved on this device"); return; }
    // debounce network saves a touch
    dirty = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async function () {
      try { await pushBoard(state); dirty = false; saveNote("Saved"); }
      catch (e) { saveLocal(state); saveNote("Couldn't reach the store — kept a copy on this device"); }
    }, 250);
  }
  function saveNote(t) {
    var n = document.getElementById("saveNote"); if (!n) return;
    n.textContent = t;
    var settled = /^Saved/.test(t);
    n.classList.toggle("settled", settled);
    if (settled) { n.classList.remove("pulse"); void n.offsetWidth; n.classList.add("pulse"); }
  }

  // If you leave mid-thought (close the tab, switch away, lock the phone),
  // push any pending edit right now so a thread is never lost to the debounce.
  function flush() {
    if (!dirty || localMode || !TOKEN) return;
    clearTimeout(saveTimer);
    saveLocal(state);              // belt-and-braces copy on this device
    try { pushBoard(state, true); } catch (e) {}
    dirty = false;
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") flush();
  });
  window.addEventListener("pagehide", flush);

  // ---------- gate ----------
  var gate = document.getElementById("gate");
  var app = document.getElementById("app");
  function showApp() { gate.classList.add("hidden-el"); app.classList.remove("hidden-el"); }
  function showGate() { app.classList.add("hidden-el"); gate.classList.remove("hidden-el"); }

  async function enterWith(word, fromRemember) {
    TOKEN = (word || "").trim();
    var err = document.getElementById("gateErr");
    var btn = document.getElementById("enter");
    if (err) err.textContent = "";
    if (!TOKEN) { if (err) err.textContent = "Enter the word."; return; }
    if (btn) { btn.disabled = true; btn.textContent = "Opening…"; }

    var board = null;
    try {
      board = await fetchBoard();               // function mode
      localMode = false;
    } catch (e) {
      if (e.message === "unauthorised") {
        if (btn) { btn.disabled = false; btn.textContent = "Enter"; }
        if (!fromRemember && err) err.textContent = "That word wasn't recognised.";
        if (fromRemember) { try { localStorage.removeItem(WORD_KEY); } catch (x) {} } // stale saved word
        TOKEN = "";
        return;
      }
      // function not deployed / offline -> this device only
      localMode = true;
    }

    if (btn) { btn.disabled = false; btn.textContent = "Enter"; }
    try { if (document.getElementById("remember").checked) localStorage.setItem(WORD_KEY, TOKEN); } catch (x) {}

    if (localMode) {
      state = loadLocal() || seed();
      saveLocal(state);
      banner("Working on this device only — the Keeper's store isn't connected yet. Your edits are saved here and move up once the function's live.");
    } else if (!board) {
      // store reachable but empty: offer to bring up any local board rather than silently seeding
      var local = loadLocal();
      if (local) {
        state = local;
        banner("A board saved on this device is showing. Bring it into the Keeper's store?", "Sync it up", async function () {
          try { await pushBoard(state); banner(""); saveNote("Saved"); }
          catch (e) { saveNote("Couldn't reach the store just now"); }
        });
      } else {
        state = seed();
        try { await pushBoard(state); banner(""); }
        catch (e) {
          localMode = true; saveLocal(state);
          banner("Working on this device only — the Keeper's store isn't connected yet. Your edits are saved here and move up once the function's live.");
        }
      }
    } else {
      state = board;
      banner("");
    }

    showApp();
    render();
    saveNote(localMode ? "Saved on this device" : "Saved");
  }

  function banner(msg, actionLabel, actionFn) {
    var b = document.getElementById("banner");
    var m = document.getElementById("bannerMsg");
    var a = document.getElementById("bannerAction");
    if (!msg) { b.classList.add("hidden-el"); return; }
    m.textContent = msg;
    b.classList.remove("hidden-el");
    if (actionLabel && actionFn) {
      a.textContent = actionLabel; a.classList.remove("hidden-el"); a.onclick = actionFn;
    } else { a.classList.add("hidden-el"); a.onclick = null; }
  }

  document.getElementById("enter").onclick = function () { enterWith(document.getElementById("pw").value); };
  document.getElementById("pw").addEventListener("keydown", function (e) {
    if (e.key === "Enter") enterWith(document.getElementById("pw").value);
  });
  document.getElementById("forget").onclick = function () {
    try { localStorage.removeItem(WORD_KEY); } catch (e) {}
    TOKEN = ""; document.getElementById("pw").value = ""; showGate();
  };
  document.getElementById("reset").onclick = function () {
    if (confirm("Clear every thread from the desk? This empties all four lanes.")) {
      state = seed(); commit();
    }
  };

  // ---------- render ----------
  function esc(t) {
    return String(t == null ? "" : t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function render() { renderPickup(); renderBoard(); }

  function renderPickup() {
    var host = document.getElementById("pickup");
    var item = (state.warm[0]) || (state.cooling[0]) || null;
    if (!item) { host.innerHTML = '<p class="pu-empty">Nothing warm yet. Add a thread below to begin.</p>'; return; }
    var k = KINDS[item.kind] || KINDS.prose;
    host.innerHTML =
      '<p class="pu-title"><span class="pu-kind">' + k.glyph + '</span>' + esc(item.title) + '</p>' +
      (item.next ? '<p class="pu-next">' + esc(item.next) + '</p>' : '');
  }

  function renderBoard() {
    var board = document.getElementById("board");
    board.innerHTML = "";
    LANES.forEach(function (lane) {
      var meta = LANE_META[lane];
      var col = document.createElement("section");
      col.className = "lane"; col.setAttribute("data-lane", lane);
      var head = document.createElement("div");
      head.className = "lane-head";
      head.innerHTML = '<h2>' + meta.title + '</h2><span class="whisper">' + meta.whisper + '</span>';
      col.appendChild(head);

      state[lane].forEach(function (item) {
        col.appendChild(editing === item.id ? editorNode(item, lane) : cardNode(item, lane));
      });

      if (editing === "new:" + lane) { col.appendChild(editorNode(null, lane)); }
      else {
        var add = document.createElement("button");
        add.className = "add";
        add.textContent = lane === "seeds" ? "+ drop a line" : "+ add a thread";
        add.onclick = function () { editing = "new:" + lane; render(); };
        col.appendChild(add);
      }
      board.appendChild(col);
    });
  }

  function cardNode(item, lane) {
    var k = KINDS[item.kind] || KINDS.prose;
    var el = document.createElement("div");
    el.className = "card";
    el.innerHTML =
      '<div class="kind"><span class="glyph">' + k.glyph + '</span>' + k.label + '</div>' +
      '<h3>' + esc(item.title) + '</h3>' +
      (item.next ? '<p class="next">' + esc(item.next) + '</p>' : '') +
      '<div class="row"></div>';
    var row = el.querySelector(".row");
    row.appendChild(mkBtn("↑", "", function () { reorder(item.id, lane, -1); }, "Move up in this lane"));
    row.appendChild(mkBtn("↓", "", function () { reorder(item.id, lane, +1); }, "Move down in this lane"));
    if (lane === "seeds") {
      row.appendChild(mkBtn("weave →", "warmer", function () { weave(item.id); }, "Turn this fragment into a Cold prose thread"));
    } else {
      if (lane !== "warm") row.appendChild(mkBtn("warmer", "warmer", function () { move(item.id, lane, -1); }));
      if (lane !== "cold") row.appendChild(mkBtn("cooler", "cooler", function () { move(item.id, lane, +1); }));
    }
    var sp = document.createElement("span"); sp.className = "spacer"; row.appendChild(sp);
    row.appendChild(mkBtn("edit", "", function () { editing = item.id; render(); }));
    row.appendChild(mkBtn("×", "del", function () { remove(item.id, lane); }, "Remove"));
    return el;
  }

  function editorNode(item, lane) {
    var el = document.createElement("div");
    el.className = "card editor";
    var kind = item ? item.kind : (lane === "seeds" ? "poem" : "prose");
    var opts = Object.keys(KINDS).map(function (key) {
      return '<option value="' + key + '"' + (key === kind ? " selected" : "") + '>' + KINDS[key].glyph + "  " + KINDS[key].label + '</option>';
    }).join("");
    el.innerHTML =
      '<select class="e-kind">' + opts + '</select>' +
      '<input class="e-title" placeholder="' + (lane === "seeds" ? "a line, an image, a fragment…" : "the thread…") + '" value="' + esc(item ? item.title : "") + '" />' +
      '<textarea class="e-next" placeholder="' + (lane === "seeds" ? "(optional) where it might lead" : "the next returnable move — small enough to finish") + '">' + esc(item ? item.next : "") + '</textarea>' +
      '<div class="erow"><button class="mini save">save</button><button class="mini cancel">cancel</button></div>';
    var titleInput = el.querySelector(".e-title");
    setTimeout(function () { titleInput.focus(); }, 0);
    el.querySelector(".save").onclick = function () {
      var t = titleInput.value.trim();
      if (!t) { titleInput.focus(); return; }
      var payload = { kind: el.querySelector(".e-kind").value, title: t, next: el.querySelector(".e-next").value.trim() };
      if (item) { Object.assign(item, payload); }
      else { state[lane].unshift(Object.assign({ id: uid() }, payload)); }
      editing = null; commit();
    };
    el.querySelector(".cancel").onclick = function () { editing = null; render(); };
    titleInput.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") { ev.preventDefault(); el.querySelector(".save").click(); }
      if (ev.key === "Escape") { editing = null; render(); }
    });
    return el;
  }

  function mkBtn(label, cls, fn, title) {
    var b = document.createElement("button");
    b.className = "mini" + (cls ? " " + cls : "");
    b.textContent = label;
    if (title) b.title = title;
    b.onclick = fn;
    return b;
  }

  // ---------- mutations ----------
  function pull(id, lane) {
    var arr = state[lane], idx = arr.findIndex(function (x) { return x.id === id; });
    return idx > -1 ? arr.splice(idx, 1)[0] : null;
  }
  function move(id, lane, dir) {
    var order = ["warm", "cooling", "cold"], i = order.indexOf(lane), target = order[i + dir];
    if (!target) return;
    var item = pull(id, lane);
    if (item) { state[target].unshift(item); commit(); }
  }
  function reorder(id, lane, dir) {
    var arr = state[lane], i = arr.findIndex(function (x) { return x.id === id; });
    if (i < 0) return;
    var j = i + dir; if (j < 0 || j >= arr.length) return;
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    commit();
  }
  function weave(id) {
    var item = pull(id, "seeds");
    if (!item) return;
    state.cold.unshift({ id: uid(), kind: "prose", title: item.title, next: item.next || "Draft the scene from this fragment." });
    commit();
  }
  function remove(id, lane) { pull(id, lane); commit(); }

  // Drifting motes, so the desk and the console feel like one place.
  (function () {
    var host = document.getElementById("motes");
    if (!host) return;
    for (var i = 0; i < 20; i++) {
      var m = document.createElement("div");
      m.className = "mote";
      var sz = 2 + Math.random() * 2.6;
      m.style.width = sz + "px"; m.style.height = sz + "px";
      m.style.left = (Math.random() * 100) + "%";
      m.style.animationDuration = (14 + Math.random() * 12) + "s, " + (3 + Math.random() * 3) + "s";
      m.style.animationDelay = (-Math.random() * 18) + "s, " + (-Math.random() * 4) + "s";
      m.style.setProperty("--drift", (Math.random() * 70 - 35) + "px");
      host.appendChild(m);
    }
  })();

  // ---------- boot: auto-enter if this device remembers the word ----------
  (function () {
    var saved = null;
    try { saved = localStorage.getItem(WORD_KEY); } catch (e) {}
    if (saved) { enterWith(saved, true); }
    else { document.getElementById("pw").focus(); }
  })();
})();
</script>
</body>
</html>
