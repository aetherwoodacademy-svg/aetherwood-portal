<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aetherwood · The Corridor</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--font:'Cormorant Garamond',serif;--serif:'Cormorant Garamond',serif;--indigo:#0a0814;--indigo-deep:#060410;--forest-deep:#0a160f;}
html,body{width:100%;height:100%;background:var(--forest-deep);overflow:hidden;
  font-family:var(--font);user-select:none;-webkit-user-select:none;}
.corridor{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none;cursor:grab;background:var(--forest-deep);}
.corridor.dragging{cursor:grabbing;}
.corridor *{touch-action:none;-webkit-touch-callout:none;}

/* ————— SCENES : one full image at a time, dissolving into the next ————— */
#scenes{position:absolute;inset:0;z-index:1;}
.scene{position:absolute;inset:0;background-position:center;background-size:cover;
  will-change:opacity,transform,filter;opacity:0;}
/* the green nebula you travel through between doors */
#nebTransit{position:absolute;inset:-6%;z-index:2;pointer-events:none;opacity:0;will-change:opacity,transform;
  background:url('https://res.cloudinary.com/ds8pkprtb/image/upload/corridor_nebula.png') center center / cover no-repeat;
  filter:brightness(1.05) saturate(1.12);}
/* a rushing bloom of light as you're carried through */
#warp{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;will-change:opacity,transform;mix-blend-mode:screen;
  background:radial-gradient(circle at 50% 50%,rgba(255,232,168,0) 22%,rgba(244,206,126,0.18) 44%,rgba(120,205,150,0.12) 62%,transparent 80%);}

/* soft top and bottom veils, only so text stays legible over the art */
#veil{position:absolute;inset:0;z-index:3;pointer-events:none;
  background:linear-gradient(to bottom,rgba(4,3,10,0.5) 0%,transparent 22%,transparent 62%,rgba(4,3,10,0.72) 100%);}

/* ————— STEP THROUGH : the door's invitation ————— */
#doorText{position:absolute;left:0;right:0;bottom:15%;z-index:20;text-align:center;pointer-events:none;
  opacity:0;transition:opacity 0.9s ease;}
#doorText.show{opacity:1;}
.dt-name{font-size:clamp(22px,6vw,38px);letter-spacing:0.1em;color:rgba(246,228,176,0.96);
  text-shadow:0 0 26px rgba(238,182,96,0.6),0 2px 12px rgba(0,0,0,0.9);}
.dt-enter{margin-top:0.7em;font-size:clamp(9px,2.4vw,12px);letter-spacing:0.5em;text-transform:uppercase;
  color:rgba(238,200,120,0.86);text-shadow:0 0 16px rgba(236,170,80,0.7),0 0 8px rgba(0,0,0,0.9);
  animation:enterBreath 3.4s ease-in-out infinite;}
@keyframes enterBreath{0%,100%{opacity:0.66;}50%{opacity:1;}}
.dt-enter.sealed{color:rgba(184,192,230,0.7);text-transform:none;letter-spacing:0.16em;font-style:italic;animation:none;
  text-shadow:0 0 14px rgba(120,130,200,0.5),0 0 8px rgba(0,0,0,0.9);}

/* ————— NAV TABS : glowing invitations to walk on ————— */
.nav-zone{position:absolute;top:0;bottom:0;width:26%;z-index:30;cursor:pointer;display:flex;align-items:center;
  pointer-events:auto;opacity:0;transition:opacity 0.7s ease;}
.nav-zone.avail{opacity:1;}
#navBack{left:0;justify-content:flex-start;padding-left:6px;}
#navFwd{right:0;justify-content:flex-end;padding-right:6px;}
.nav-chev{position:relative;font-size:clamp(30px,9vw,52px);line-height:1;padding:0 14px;
  color:rgba(250,226,166,0.95);
  text-shadow:0 0 26px rgba(244,186,92,1),0 0 10px rgba(240,170,70,0.8),0 0 4px rgba(0,0,0,0.7);
  animation:chevBreath 3.2s ease-in-out infinite;}
.nav-chev::before{content:'';position:absolute;left:50%;top:50%;width:40vw;max-width:190px;height:60vh;max-height:340px;
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;z-index:-1;filter:blur(8px);
  background:radial-gradient(ellipse at center,rgba(8,6,14,0.5),rgba(8,6,14,0.24) 42%,transparent 72%);}
@keyframes chevBreath{0%,100%{opacity:0.72;transform:scale(1);}50%{opacity:1;transform:scale(1.06);}}

/* warm bloom feedback when you step through (only used where a scene has no room yet) */
#bloom{position:absolute;left:50%;top:52%;width:10px;height:10px;transform:translate(-50%,-50%);z-index:25;
  border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(255,224,150,0.9),rgba(240,180,90,0.4) 40%,transparent 72%);}
#bloom.go{animation:bloom 0.9s ease-out;}
@keyframes bloom{0%{opacity:0.9;width:10px;height:10px;}100%{opacity:0;width:150vw;height:150vw;}}

#greeting{position:absolute;left:50%;top:33%;transform:translateX(-50%);z-index:22;text-align:center;
  white-space:nowrap;pointer-events:none;opacity:0;font-style:italic;font-size:clamp(15px,3.8vw,21px);
  color:rgba(230,214,184,0.92);text-shadow:0 0 18px rgba(0,0,0,0.9);animation:greetFlow 6s ease 1s both;}
@keyframes greetFlow{0%{opacity:0;}24%{opacity:0.92;}74%{opacity:0.92;}100%{opacity:0;}}

.fade-cover{position:absolute;inset:0;
  background:url('https://res.cloudinary.com/ds8pkprtb/image/upload/corridor_nebula.png') center center / cover no-repeat, var(--forest-deep);
  opacity:1;z-index:80;pointer-events:none;transition:opacity 1.5s ease;}

/* ————— EVERFLAME ————— */
#everflame{position:fixed;top:3.5vmin;left:3.5vmin;width:10vmin;height:10vmin;min-width:64px;min-height:64px;
  background:url('https://res.cloudinary.com/ds8pkprtb/image/upload/aetherwood/portal/everflame.jpg') center bottom / contain no-repeat;
  mix-blend-mode:screen;filter:brightness(1.1);transition:filter 1.5s ease;z-index:200;cursor:pointer;pointer-events:all;
  animation:efLive 4.5s ease-in-out infinite;}
#efMenu{position:fixed;top:calc(3.5vmin + 10vmin + 18px);left:3vmin;z-index:201;pointer-events:none;
  opacity:0;transform:translateY(-8px);transition:opacity 0.7s ease,transform 0.7s ease;text-align:left;}
#efMenu.open{opacity:1;pointer-events:all;transform:translateY(0);}
#efMenu::before{content:'';position:absolute;top:-50px;left:-50px;right:-30px;bottom:-80px;
  background:radial-gradient(ellipse at 18% 0%,rgba(6,3,9,0.82) 0%,rgba(6,3,9,0.5) 45%,transparent 78%);pointer-events:none;z-index:-1;}
.ef-section-label{display:block;font-family:var(--serif);font-size:clamp(7px,0.68vw,8px);letter-spacing:0.5em;
  text-transform:uppercase;color:rgba(175,140,72,0.35);margin-bottom:0.85em;}
.ef-link.ef-current{color:rgba(220,180,95,0.28);cursor:default;}
.ef-links{list-style:none;margin-bottom:1.5em;}
.ef-item{margin-bottom:0.35em;}
.ef-link{display:block;background:none;border:none;padding:0;font-family:var(--serif);font-size:clamp(9px,0.85vw,11px);
  letter-spacing:0.42em;text-transform:uppercase;color:rgba(220,180,95,0.72);cursor:pointer;
  text-shadow:0 1px 8px rgba(0,0,0,0.95);transition:color 0.4s ease;white-space:nowrap;margin-left:0;}
.ef-link:hover{color:rgba(245,215,135,0.96);}
.ef-divider{width:28px;border:none;border-top:1px solid rgba(160,125,55,0.2);margin:0 auto 1.4em 0;}
#efScrim{position:fixed;inset:0;z-index:199;pointer-events:none;}
#efScrim.open{pointer-events:all;}
@keyframes efLive{0%{transform:translateY(0) rotate(-2deg) scaleX(1);}18%{transform:translateY(-4px) rotate(2.5deg) scaleX(0.93);}
  35%{transform:translateY(-9px) rotate(-1.5deg) scaleX(1.06);}52%{transform:translateY(-7px) rotate(3deg) scaleX(0.95);}
  68%{transform:translateY(-11px) rotate(-2deg) scaleX(1.04);}82%{transform:translateY(-5px) rotate(1.5deg) scaleX(0.97);}100%{transform:translateY(0) rotate(-2deg) scaleX(1);}}

/* ————— LEGIBLE-TEXT STANDARD (locked 8 Jul 2026) — floors lifted, placed last ————— */
.dt-enter{font-size:clamp(16px,4.2vw,19px);}
.dt-enter.velin{text-transform:none;letter-spacing:0.06em;font-style:italic;}
#moveHint{position:absolute;left:50%;bottom:30%;transform:translateX(-50%);z-index:22;text-align:center;font-style:italic;font-size:clamp(14px,3.4vw,17px);letter-spacing:0.04em;color:rgba(226,214,190,0.72);text-shadow:0 0 16px rgba(0,0,0,0.9);opacity:0;transition:opacity 1.4s ease;pointer-events:none;white-space:nowrap;}
#moveHint.show{opacity:1;}
#greeting{font-size:clamp(19px,5.2vw,26px);}
.ef-section-label{font-size:clamp(12px,1vw,13px);}
.ef-link{font-size:clamp(12px,1.05vw,13px);letter-spacing:0.3em;}
</style>
  <script src="sound-control.js"></script>
</head>
<body>
<div class="corridor" id="corridor">
  <div id="scenes"></div>
  <div id="nebTransit"></div>
  <div id="warp"></div>
  <div id="veil"></div>

  <div id="doorText">
    <div class="dt-name" id="dtName"></div>
    <div class="dt-enter">step through</div>
  </div>

  <div class="nav-zone" id="navBack"><span class="nav-chev">&#8249;</span></div>
  <div class="nav-zone" id="navFwd"><span class="nav-chev">&#8250;</span></div>
  <div id="bloom"></div>

  <div id="greeting">The forest has been waiting, wanderer.</div>
  <div id="moveHint">swipe to explore &middot; tap a door to step through</div>
  <div class="fade-cover" id="fadeCover"></div>
</div>

<div id="everflame" role="button" tabindex="0" aria-label="The Everflame"></div>
<nav id="efMenu" aria-label="The Everflame">
  <div id="efTrail">
    <span class="ef-section-label">where you've walked</span>
    <ul class="ef-links" id="efTrailList"></ul>
    <hr class="ef-divider">
  </div>
  <ul class="ef-links">
    <li class="ef-item"><button class="ef-link" id="efArchives">the whispered archives</button></li>
    <li class="ef-item"><button class="ef-link" id="efHearthfire">the hearthfire</button></li>
    <li class="ef-item"><button class="ef-link" id="efLeave">leave the forest</button></li>
  </ul>
</nav>
<div id="efScrim"></div>

<script src="lunar.js"></script>
<script>
(function(){
  var SCENES = [
    {img:'whispered_archives_1.png', name:'Whispered Archives', href:'whispered-archives.html?tuition=1', enter:'Step through and all will be unveiled.', velin:true},
    {img:'Library_of_tales1.png',    name:'Library of Tales',   href:'library.html'},
    {img:'compliance_office_1.png',  name:'Compliance Office',  href:'compliance.html'},
    {img:'resonance_1.png',          name:'Resonance Chamber',  href:'', sealed:true},
    {img:'end_threshold_corridor.png', name:'The Hearthfire',   href:'hearthfire.html', enter:'into the hearthfire'}
  ];
  /* the Resonance Chamber wakes only at the dark of the moon */
  (function(){
    function darkOpen(){
      try{ var p=new URLSearchParams(location.search); if(/^dark(-moon)?$/.test(p.get('phase')||'')) return true; }catch(e){}
      if(typeof LUNAR!=='undefined'){ try{ var ls=LUNAR.getLunarState(); if(ls&&ls.phase){ var k=ls.phase.key||ls.phase; return /dark/i.test(k); } }catch(e){} }
      return false;
    }
    if(darkOpen()){ var q=''; try{var pp=new URLSearchParams(location.search); if(pp.get('phase')) q='?phase='+pp.get('phase');}catch(e){}
      SCENES[3].sealed=false; SCENES[3].href='resonance_snug.html'+q; }
  })();
  var LAST = SCENES.length - 1;
  var CDN = 'https://res.cloudinary.com/ds8pkprtb/image/upload/';
  var START_POS = -0.35;
  var FRICTION=0.958, SPRING=0.028, GOAL_SPRING=0.014, SETTLE_VEL=0.0008;

  var corridor = document.getElementById('corridor');
  var scenesEl = document.getElementById('scenes');
  var doorText = document.getElementById('doorText');
  var dtName   = document.getElementById('dtName');
  var dtEnter  = doorText.querySelector('.dt-enter');
  var navBack  = document.getElementById('navBack');
  var navFwd   = document.getElementById('navFwd');
  var nebTransit = document.getElementById('nebTransit');
  var warp     = document.getElementById('warp');
  var bloom    = document.getElementById('bloom');
  var fadeCover= document.getElementById('fadeCover');

  var layers = SCENES.map(function(s){
    var d = document.createElement('div');
    d.className = 'scene';
    d.style.backgroundImage = "url('"+CDN+s.img+"')";
    scenesEl.appendChild(d);
    return d;
  });

  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

  var pos = START_POS, vel = 0, goal = null;
  var dragging=false, moved=0, lastX=0, downT=0;
  var W = window.innerWidth;
  window.addEventListener('resize', function(){ W = window.innerWidth; });

  /* arrival: fresh from the Threshold, or returning from a room */
  var params = new URLSearchParams(location.search);
  var fromThreshold = params.get('from') === 'threshold';
  try{
    var rp = sessionStorage.getItem('aetherwood_corridor_pos');
    if(!fromThreshold && rp!==null){ var rn=parseInt(rp,10); if(rn>=0 && rn<=LAST){ pos=rn; } }
  }catch(e){}
  var gEl=document.getElementById('greeting');
  if(!fromThreshold){ if(gEl) gEl.style.display='none'; }
  else if(gEl){
    var crossed='', nm=''; try{ crossed=localStorage.getItem('aetherwood.crossed')||''; if(crossed==='named') nm=(localStorage.getItem('aetherwood.name')||'').trim(); }catch(e){}
    gEl.textContent = 'The forest has been waiting, ' + (nm || 'wanderer') + '.';
  }

  var shownName = null;

  function render(){
    var nf = clamp(Math.round(pos), 0, LAST);
    var dist = Math.abs(pos - nf);           // 0 at a door, 0.5 mid-travel
    var transit = clamp(dist*2, 0, 1);       // 0 settled, 1 deepest in the nebula
    var speed = clamp(Math.abs(vel)*7, 0, 1);

    // the nebula rises to carry you between doors, then recedes
    nebTransit.style.opacity = (transit*0.92).toFixed(3);
    nebTransit.style.transform = 'scale('+(1.06 + 0.16*transit).toFixed(3)+')';
    warp.style.opacity = (Math.max(transit*0.6, speed*0.85)*0.7).toFixed(3);
    warp.style.transform = 'scale('+(1 + 0.7*Math.max(transit,speed)).toFixed(3)+')';

    for(var i=0;i<layers.length;i++){
      var d = i - pos;                       // >0 ahead, <0 behind
      var base = clamp(1 - Math.abs(d), 0, 1);
      var op = base * (1 - 0.55*transit);    // doors dissolve into the nebula mid-travel
      var sc = (d>=0) ? (1 - 0.11*d)         // the door ahead sits deep, grows as you near it
                      : (1 + 0.36*(-d));      // the door behind zooms gently as you pass through it
      sc = clamp(sc, 0.82, 1.5);
      var bl = clamp(Math.abs(d)*2 + transit*1.4, 0, 5);
      layers[i].style.opacity = op.toFixed(3);
      layers[i].style.transform = 'scale('+sc.toFixed(3)+')';
      layers[i].style.filter = 'blur('+bl.toFixed(2)+'px)';
      layers[i].style.zIndex = String(100 - Math.round(Math.abs(d)*10));
      layers[i].style.display = op<=0.01 ? 'none' : '';
    }
    var nearest = clamp(Math.round(pos), 0, LAST);
    var atRest = !dragging && Math.abs(vel)<SETTLE_VEL && goal===null;
    if(Math.abs(pos-nearest) < 0.34){
      if(shownName!==nearest){ shownName=nearest;
        dtName.textContent = SCENES[nearest].name;
        dtEnter.textContent = SCENES[nearest].sealed ? 'sleeps until the dark of the moon' : (SCENES[nearest].enter || 'step through');
        dtEnter.classList.toggle('sealed', !!SCENES[nearest].sealed);
        dtEnter.classList.toggle('velin', !SCENES[nearest].sealed && !!SCENES[nearest].velin);
      }
      doorText.classList.add('show');
    } else { doorText.classList.remove('show'); shownName=null; }

    navBack.classList.toggle('avail', true);
    navFwd.classList.toggle('avail', pos < LAST - 0.12);
  }

  function frame(){
    if(!dragging){
      if(goal!==null){ pos += (goal-pos)*GOAL_SPRING; if(Math.abs(goal-pos)<0.002){pos=goal;goal=null;} vel=0; }
      else { pos += vel; vel*=FRICTION; var n=clamp(Math.round(pos),0,LAST); if(Math.abs(vel)<SETTLE_VEL){ pos += (n-pos)*SPRING; } }
      pos = clamp(pos, START_POS, LAST);
    }
    render();
    requestAnimationFrame(frame);
  }

  function startDrag(x){ dragging=true; corridor.classList.add('dragging'); lastX=x; downT=Date.now(); moved=0; vel=0; goal=null; }
  function moveDrag(x){ if(!dragging) return; var dx=x-lastX; lastX=x; moved+=Math.abs(dx); var dp=-dx/(W*1.7); pos+=dp; vel=dp; pos=clamp(pos,START_POS,LAST); }
  function stopDrag(){ if(!dragging) return; dragging=false; corridor.classList.remove('dragging'); }

  corridor.addEventListener('touchstart', function(e){ if(e.target.closest('.nav-zone')) return; startDrag(e.touches[0].clientX); }, {passive:true});
  corridor.addEventListener('touchmove',  function(e){ if(!dragging) return; moveDrag(e.touches[0].clientX); if(e.cancelable) e.preventDefault(); }, {passive:false});
  corridor.addEventListener('touchend',   function(e){ var tap = dragging && moved<10 && (Date.now()-downT)<460; stopDrag(); if(tap && !e.target.closest('.nav-zone')) handleTap(e); });
  corridor.addEventListener('mousedown', function(e){ if(e.target.closest('.nav-zone')) return; startDrag(e.clientX); });
  document.addEventListener('mousemove', function(e){ moveDrag(e.clientX); });
  document.addEventListener('mouseup',   function(e){ var tap = dragging && moved<10 && (Date.now()-downT)<460; stopDrag(); if(tap) handleTap(e); });
  corridor.addEventListener('wheel', function(e){ goal=null; pos=clamp(pos+e.deltaY*0.0016,START_POS,LAST); vel=0; }, {passive:true});

  function stepTo(d){ goal = clamp(Math.round(pos)+d, 0, LAST); vel=0; }
  navBack.addEventListener('click', function(e){ e.stopPropagation();
    if(Math.round(pos) <= 0){ leaveToThreshold(); } else { stepTo(-1); } });
  navFwd.addEventListener('click',  function(e){ e.stopPropagation(); stepTo(+1); });

  /* First-movement hint — held back so we give the visitor the benefit of the
     doubt, and it vanishes the moment they move. Never blocks anything. */
  (function(){
    var hint=null, hasMoved=false;
    function markMoved(){ if(hasMoved) return; hasMoved=true; if(hint) hint.classList.remove('show'); }
    window.addEventListener('load', function(){
      hint=document.getElementById('moveHint');
      setTimeout(function(){ if(!hasMoved && hint) hint.classList.add('show'); }, 7000);
    });
    corridor.addEventListener('touchmove', function(){ if(dragging && moved>24) markMoved(); }, {passive:true});
    corridor.addEventListener('wheel', markMoved, {passive:true});
    document.addEventListener('mousemove', function(){ if(dragging && moved>24) markMoved(); });
    navBack.addEventListener('click', markMoved);
    navFwd.addEventListener('click', markMoved);
    document.addEventListener('keydown', function(e){ if(e.key==='ArrowLeft'||e.key==='ArrowRight') markMoved(); });
  })();

  function handleTap(e){
    var nearest = clamp(Math.round(pos), 0, LAST);
    if(Math.abs(pos-nearest) > 0.5) return;
    var s = SCENES[nearest];
    if(s.href){ enter(s.href, nearest); }
    else {
      // a warm bloom where you tapped (sealed / not-yet-open scenes)
      var x = (e && (e.clientX||(e.changedTouches&&e.changedTouches[0].clientX))) || window.innerWidth/2;
      var y = (e && (e.clientY||(e.changedTouches&&e.changedTouches[0].clientY))) || window.innerHeight*0.52;
      bloom.style.left=x+'px'; bloom.style.top=y+'px';
      bloom.classList.remove('go'); void bloom.offsetWidth; bloom.classList.add('go');
    }
  }
  var leaving=false;
  function enter(href, i){ if(leaving||!href) return; leaving=true;
    try{ sessionStorage.setItem('aetherwood_corridor_pos', String(i)); }catch(e){}
    fadeCover.style.opacity='1'; setTimeout(function(){ window.location.href=href; }, 1400); }
  function leaveToThreshold(){ if(leaving) return; leaving=true; fadeCover.style.opacity='1'; setTimeout(function(){ window.location.href='index.html'; }, 1400); }

  document.addEventListener('keydown', function(e){
    if(e.key==='ArrowRight') stepTo(1);
    else if(e.key==='ArrowLeft') stepTo(-1);
    else if(e.key==='Enter') handleTap();
  });

  window.addEventListener('load', function(){ requestAnimationFrame(function(){ requestAnimationFrame(function(){ fadeCover.style.opacity='0'; }); }); });
  setTimeout(function(){ fadeCover.style.opacity='0'; }, 400);

  frame();
})();
</script>
<script>
(function(){
  var EF_ANCHORS = ['hearthfire.html', 'whispered-archives.html'];
  var trail = JSON.parse(sessionStorage.getItem('aetherwood_trail') || '[]');
  trail = trail.filter(function(e){ return e.href !== 'vestibule.html'; });
  trail.unshift({ name: 'the corridor', href: 'vestibule.html' });
  if (trail.length > 8) trail = trail.slice(0, 8);
  sessionStorage.setItem('aetherwood_trail', JSON.stringify(trail));

  function navigateEF(href){ var c=document.getElementById('fadeCover'); if(!c){window.location.href=href;return;}
    c.style.transition='opacity 1.4s ease';
    requestAnimationFrame(function(){requestAnimationFrame(function(){ c.style.opacity='1'; setTimeout(function(){window.location.href=href;},1500); });}); }

  var efMenu=document.getElementById('efMenu'), efScrim=document.getElementById('efScrim');
  var efTrailEl=document.getElementById('efTrail'), efTrailList=document.getElementById('efTrailList');
  var efOpen=false;
  function buildTrail(){
    var t = JSON.parse(sessionStorage.getItem('aetherwood_trail') || '[]');
    t = t.filter(function(e){ return e.href !== 'vestibule.html' && EF_ANCHORS.indexOf(e.href) === -1; });
    if(!t.length){ efTrailEl.style.display='none'; return; }
    efTrailEl.style.display='';
    efTrailList.innerHTML='';
    t.slice(0,3).forEach(function(e){
      var li=document.createElement('li'); li.className='ef-item';
      var btn=document.createElement('button'); btn.className='ef-link'; btn.textContent=e.name;
      btn.addEventListener('click', function(){ close(); navigateEF(e.href); });
      li.appendChild(btn); efTrailList.appendChild(li);
    });
  }
  function open(){ buildTrail(); efMenu.classList.add('open'); efScrim.classList.add('open'); efOpen=true; }
  function close(){ efMenu.classList.remove('open'); efScrim.classList.remove('open'); efOpen=false; }
  var ef=document.getElementById('everflame');
  ef.addEventListener('click', function(){ efOpen?close():open(); });
  efScrim.addEventListener('click', close);
  document.getElementById('efArchives').addEventListener('click', function(){ close(); navigateEF('whispered-archives.html'); });
  document.getElementById('efHearthfire').addEventListener('click', function(){ close(); navigateEF('hearthfire.html'); });
  document.getElementById('efLeave').addEventListener('click', function(){ close(); navigateEF('index.html'); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') close(); });
})();
</script>
</body>
