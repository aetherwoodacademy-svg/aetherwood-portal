<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Year Wheel · Aetherwood</title>
<script src="lunar.js"></script>
<script src="portal-data.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@300;400&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--serif:'Cormorant Garamond',Georgia,serif;--caps:'Cinzel',serif;--bg-deep:#04060e;
        --amber:rgba(240,196,120,.95);--amber-soft:rgba(240,196,120,.5);--violet:rgba(150,150,210,.6)}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-deep);font-family:var(--serif)}

  /* 16:9 stage so the eight stay locked to the wheel at any screen size */
  #stage{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    width:min(100vw,177.78vh);height:min(56.25vw,100vh);overflow:hidden;
    background:#04060e url('https://res.cloudinary.com/ds8pkprtb/image/upload/Season_wheel.png') center/cover no-repeat;
    animation:sceneBreathe 22s ease-in-out infinite;}
  @keyframes sceneBreathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.03)}}
  /* blurred forest fills the letterbox (esp. portrait mobile) so there are no dead black bars */
  #backdrop{position:fixed;inset:0;z-index:0;background:#04060e url('https://res.cloudinary.com/ds8pkprtb/image/upload/Season_wheel.png') center/cover no-repeat;
    filter:blur(30px) brightness(.42) saturate(.9);transform:scale(1.15);}
  #stage{z-index:1;}
  /* on tall/portrait screens, let the wheel breathe a little larger */
  @media (max-aspect-ratio: 3/4){
    #stage{width:100vw;height:100vh;background-image:url('https://res.cloudinary.com/ds8pkprtb/image/upload/season_wheel_portrait.png');
      background-position:50% 40%;animation:sceneBreatheP 22s ease-in-out infinite;}
    #backdrop{background-image:url('https://res.cloudinary.com/ds8pkprtb/image/upload/season_wheel_portrait.png');}
    #stage #heartSpin{left:29.5%!important;top:71.6%!important;width:5.5%!important;}
    #stage #heartCore{left:29.5%!important;top:71.6%!important;width:2.4%!important;}
    .station .name{font-size:12px;} .station .pron{font-size:10px;}
  }
  /* portrait zoom — steps the visitor closer to the set-back wheel */
  @keyframes sceneBreatheP{0%,100%{transform:translate(-50%,-50%) scale(1.4)}50%{transform:translate(-50%,-50%) scale(1.44)}}
  #vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%,transparent 46%,rgba(3,5,12,.35) 78%,rgba(3,5,12,.72) 100%);}
  #fadeCover{position:fixed;inset:0;z-index:900;background:var(--bg-deep);pointer-events:none;transition:opacity 2s ease;}
  #seasonWash{position:absolute;inset:0;pointer-events:none;z-index:3;
    background:linear-gradient(100deg, rgba(150,180,215,.16) 0%, transparent 42%, transparent 62%, rgba(230,165,90,.16) 100%);
    mix-blend-mode:soft-light;transition:background 1.8s ease;}

  /* stations */
  .station{position:absolute;transform:translate(-50%,-50%);z-index:8;cursor:pointer;width:54px;height:54px;
    display:flex;align-items:center;justify-content:center;}
  /* dormant — a faint point catching cold light, blended into the stone */
  .station .dot{position:relative;width:14px;height:14px;border-radius:50%;transition:.6s;mix-blend-mode:screen;filter:blur(.5px);opacity:.68;
    background:radial-gradient(circle at 46% 42%, rgba(190,200,235,.55), rgba(120,130,185,.26) 55%, transparent 76%);}
  .station:hover .dot{opacity:1;transform:scale(1.18);}
  /* current — a soft ember of real light: additive bloom, no hard disc */
  .station.current .dot{width:18px;height:18px;mix-blend-mode:screen;filter:blur(.7px);opacity:1;
    background:radial-gradient(circle at 48% 44%, rgba(255,247,216,.95), rgba(255,188,98,.68) 40%, rgba(240,120,40,.22) 70%, transparent 84%);
    animation:emberFlicker 5.5s ease-in-out infinite;}
  .station.current .dot::before{content:'';position:absolute;left:50%;top:50%;width:130px;height:130px;transform:translate(-50%,-50%);
    border-radius:50%;mix-blend-mode:screen;filter:blur(9px);pointer-events:none;
    background:radial-gradient(circle, rgba(255,172,84,.48) 0%, rgba(255,138,58,.20) 34%, transparent 68%);
    animation:haloPulse 5.5s ease-in-out infinite;}
  @keyframes emberFlicker{0%{opacity:.9;transform:scale(1)}28%{opacity:1;transform:scale(1.06)}52%{opacity:.82;transform:scale(.97)}74%{opacity:1;transform:scale(1.04)}100%{opacity:.9;transform:scale(1)}}
  @keyframes haloPulse{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.9)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.14)}}
  .station .label{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:7px;text-align:center;white-space:nowrap;
    opacity:0;transition:opacity .5s;pointer-events:none;}
  .station:hover .label,.station.current .label{opacity:1;}
  .station .name{display:block;font-family:var(--caps);font-size:clamp(9px,1.1vw,14px);letter-spacing:.18em;color:rgba(210,222,244,.6);text-shadow:0 1px 8px #000;}
  .station.current .name{color:var(--amber);text-shadow:0 0 14px rgba(240,196,120,.5),0 1px 8px #000;}
  .station .pron{display:block;font-family:var(--serif);font-style:italic;font-size:clamp(8px,.92vw,11px);letter-spacing:.04em;color:rgba(200,212,236,.5);text-shadow:0 1px 6px #000;margin-top:1px;}
  /* reveal-all mode (?all=1) — see every station at once to check symmetry */
  #stations.reveal .station .dot{opacity:1;}
  #stations.reveal .station .label{opacity:1;}
  #stations.reveal .station:not(.current) .dot{outline:1px solid rgba(255,210,140,.6);outline-offset:4px;border-radius:50%;}
  /* the spinning heart — a churn of light over the carved spiral (position = est, nudge like a station) */
  #heartSpin{position:absolute;left:49.5%;top:51%;transform:translate(-50%,-50%);width:6%;aspect-ratio:1;border-radius:50%;
    pointer-events:none;z-index:5;mix-blend-mode:screen;filter:blur(1.5px);
    background:conic-gradient(from 0deg,
      rgba(255,196,104,0) 0deg, rgba(255,206,120,.26) 46deg, rgba(255,170,70,0) 100deg,
      rgba(255,200,110,0) 180deg, rgba(255,206,120,.2) 224deg, rgba(255,170,70,0) 284deg,
      rgba(255,196,104,0) 360deg);
    animation:heartSpin 17s linear infinite;}
  @keyframes heartSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  #heartCore{position:absolute;left:49.5%;top:51%;transform:translate(-50%,-50%);width:2.4%;aspect-ratio:1;border-radius:50%;
    pointer-events:none;z-index:5;mix-blend-mode:screen;filter:blur(1px);
    background:radial-gradient(circle, rgba(255,242,206,.45), rgba(255,182,92,.16) 52%, transparent 76%);
    animation:heartPulse 5s ease-in-out infinite;}
  @keyframes heartPulse{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(.9)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}}

  /* dormant whisper */
  #whisper{position:absolute;z-index:12;transform:translate(-50%,-140%);pointer-events:none;
    font-family:var(--serif);font-style:italic;font-size:clamp(13px,1.3vw,17px);color:rgba(210,222,244,.82);
    text-shadow:0 0 3px #000,0 1px 8px #000;opacity:0;transition:opacity .6s;text-align:center;width:240px;}
  #whisper.show{opacity:1;}

  /* everflame nav */
  #everflame{position:fixed;top:3.5vmin;left:3.5vmin;width:12vmin;height:12vmin;min-width:82px;min-height:82px;
    background:url('https://res.cloudinary.com/ds8pkprtb/image/upload/aetherwood/portal/everflame.jpg') center bottom/contain no-repeat;
    mix-blend-mode:screen;filter:brightness(.9);z-index:200;cursor:pointer;animation:efLive 8s ease-in-out infinite;}
  #everflame:hover{filter:brightness(1.6) saturate(1.1);}
  @keyframes efLive{0%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-6px) rotate(1deg)}100%{transform:translateY(0) rotate(-1deg)}}
  #efMenu{position:fixed;top:calc(3.5vmin + 12vmin + 16px);left:3vmin;z-index:201;pointer-events:none;opacity:0;transform:translateY(8px);transition:.7s;}
  #efMenu.open{opacity:1;pointer-events:all;transform:translateY(0);}
  #efMenu::before{content:'';position:absolute;top:-70px;left:-40px;right:-50px;bottom:-30px;
    background:radial-gradient(ellipse at 22% 0%,rgba(4,6,18,.85),rgba(4,6,18,.5) 45%,transparent 78%);z-index:-1;}
  .ef-section-label{display:block;font-family:var(--serif);font-size:clamp(12px,1vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(165,185,220,.32);margin-bottom:.85em;}
  .ef-links{list-style:none;margin-bottom:1.5em;}.ef-item{margin-bottom:.35em;}
  .ef-link{display:block;background:none;border:none;padding:0;font-family:var(--serif);font-size:clamp(12px,1.05vw,13px);letter-spacing:.3em;text-transform:uppercase;color:rgba(195,212,235,.68);cursor:pointer;text-shadow:0 1px 8px rgba(0,0,0,.95);transition:color .4s;white-space:nowrap;}
  .ef-link:hover{color:rgba(220,232,248,.96);}
  .ef-divider{width:28px;border:none;border-top:1px solid rgba(140,165,210,.18);margin:0 0 1.4em;}
  #efScrim{position:fixed;inset:0;z-index:199;pointer-events:none;}#efScrim.open{pointer-events:all;}

  #roomLabel{position:fixed;bottom:3vmin;left:50%;transform:translateX(-50%);font-size:clamp(8px,.68vw,10px);letter-spacing:.58em;text-transform:uppercase;color:rgba(165,185,220,.3);z-index:10;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.95);font-family:var(--caps);}

  #arrivalLine{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;text-align:center;pointer-events:none;opacity:0;transition:opacity 2s ease;width:90vw;}
  #arrivalLine span{font-size:clamp(20px,2.3vw,32px);font-weight:300;font-style:italic;color:rgba(215,222,244,.94);letter-spacing:.06em;text-shadow:0 0 2px #000,0 1px 6px #000,0 0 40px rgba(0,0,0,.85);}

  /* step-through overlay (placeholder until seasonal worlds are rendered) */
  #through{position:fixed;inset:0;z-index:800;pointer-events:none;opacity:0;transition:opacity 1.4s ease;
    display:flex;align-items:center;justify-content:center;text-align:center;}
  #through.show{opacity:1;pointer-events:all;}
  #through .msg{max-width:600px;padding:0 6vw;}
  #through .season{font-family:var(--caps);font-size:clamp(26px,4vw,46px);letter-spacing:.06em;color:var(--amber);text-shadow:0 0 30px rgba(240,196,120,.4);}
  #through .sub{font-family:var(--serif);font-style:italic;font-size:clamp(15px,1.5vw,20px);color:rgba(215,222,244,.8);margin-top:1em;line-height:1.6;}
  #through .back{margin-top:2em;font-family:var(--caps);font-size:clamp(8px,.7vw,10px);letter-spacing:.5em;text-transform:uppercase;color:rgba(200,205,230,.5);cursor:pointer;pointer-events:all;background:none;border:none;}
  #through .back:hover{color:rgba(240,196,120,.9);}

  /* ——— the seasonal WORLD beyond the portal ——— */
  #world{position:fixed;inset:0;z-index:820;opacity:0;pointer-events:none;transition:opacity 1.6s ease;overflow:hidden;}
  #world.show{opacity:1;pointer-events:all;}
  #world .w-bg{position:absolute;inset:0;background:#04060e center/cover no-repeat;transform:scale(1.04);}
  #world .w-vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 40%,rgba(3,5,12,.5) 80%,rgba(3,5,12,.9) 100%);}
  /* bright daylight scenes (Ostara) wash out the standard shadow strength — a touch more
     centre darkening plus a heavier text-shadow, glow-only, no scrim */
  #world.bright .w-vig{background:radial-gradient(ellipse at 50% 42%,rgba(3,5,12,.18) 30%,rgba(3,5,12,.6) 80%,rgba(3,5,12,.92) 100%);}
  #world.bright .w-hot .lab{text-shadow:0 1px 3px #000,0 0 10px #000,0 0 18px rgba(0,0,0,.9);}
  #world.bright #wReveal .r-title{text-shadow:0 1px 3px #000,0 0 12px #000;}
  #world.bright #wReveal .r-text{text-shadow:0 1px 4px #000,0 0 14px #000,0 0 6px #000;}
  #world .w-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  /* fire flickering quietly in the scene */
  #world .w-flame{position:absolute;transform:translate(-50%,-50%);pointer-events:none;mix-blend-mode:screen;
    aspect-ratio:1;border-radius:50%;filter:blur(6px);
    background:radial-gradient(circle, rgba(255,190,90,.55), rgba(255,140,50,.24) 42%, transparent 70%);
    animation:flameFlicker 2.6s ease-in-out infinite;}
  @keyframes flameFlicker{0%{opacity:.68;transform:translate(-50%,-50%) scale(1)}25%{opacity:1;transform:translate(-50%,-51%) scale(1.06)}50%{opacity:.58;transform:translate(-50%,-49%) scale(.97)}75%{opacity:.9;transform:translate(-50%,-50.5%) scale(1.04)}100%{opacity:.68;transform:translate(-50%,-50%) scale(1)}}
  /* hotspots woven into the scene */
  #world .w-hot{position:absolute;transform:translate(-50%,-50%);cursor:pointer;width:64px;height:64px;display:flex;align-items:center;justify-content:center;}
  #world .w-hot .pt{position:relative;width:13px;height:13px;border-radius:50%;mix-blend-mode:screen;filter:blur(.5px);
    background:radial-gradient(circle,rgba(255,242,206,.95),rgba(255,196,110,.55) 45%,transparent 74%);
    animation:hotBreath 3.4s ease-in-out infinite;animation-delay:var(--hd,0s);}
  #world .w-hot:hover .pt{transform:scale(1.3);}
  /* the bloom — a soft halo behind the dot, same fix as Memory Hall (6 Jul 2026): the dot alone
     was too small/subtle to be alluring, staggered per-hotspot via --hd set in buildHotspots() */
  #world .w-hot .pt::after{content:'';position:absolute;inset:-70%;border-radius:50%;z-index:-1;pointer-events:none;
    background:radial-gradient(circle,rgba(255,214,140,.62) 0%,rgba(230,175,90,.3) 45%,transparent 74%);
    filter:blur(1px);animation:hotGlowBreath 3.4s ease-in-out infinite;animation-delay:var(--hd,0s);}
  @keyframes hotBreath{0%,100%{opacity:.68;transform:scale(1)}50%{opacity:1;transform:scale(1.2)}}
  @keyframes hotGlowBreath{0%,100%{opacity:.4}50%{opacity:.9}}
  #world .w-hot .lab{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:6px;white-space:nowrap;
    font-family:var(--serif);font-style:italic;font-size:clamp(14px,1.5vw,17px);color:rgba(248,240,220,.96);
    text-shadow:0 1px 3px #000,0 0 8px #000,0 0 16px rgba(0,0,0,.9);opacity:0;transition:opacity .5s;pointer-events:none;}
  /* discovery, not clutter — the pulse (.pt) is the whole idle scene; the name only
     surfaces on hover, or the touch-equivalent .active flash (Ange, 6 Jul 2026: "hotspots
     that pulse and attract and then reveal what they are is more magical") */
  #world .w-hot:hover .lab,#world .w-hot.active .lab{opacity:1;}
  /* while reading one hotspot's reveal, every other hotspot fades and stops
     taking taps — one thing to focus on, not six competing at once (6 Jul) */
  #world.reading .w-hot{opacity:0;pointer-events:none;transition:opacity .4s ease;}
  /* the reveal — floating words on a soft dark scrim, always legible */
  #wReveal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
    opacity:0;pointer-events:none;transition:opacity .8s ease;background:none;}
  #wReveal.show{opacity:1;pointer-events:all;}
  #wReveal .r-inner{width:min(90vw,620px);padding:0 5vw;position:relative;}
  /* a soft LOCAL glow behind the words only — legible, but the world stays visible (no veil) */
  #wReveal .r-inner::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:150%;height:190%;border-radius:50%;pointer-events:none;z-index:-1;filter:blur(16px);
    background:radial-gradient(ellipse at center, rgba(6,8,16,.72), rgba(6,8,16,.32) 48%, transparent 74%);}
  #wReveal .r-title{font-family:var(--caps);font-size:clamp(9px,.8vw,11px);letter-spacing:.44em;text-transform:uppercase;color:rgba(240,196,120,.82);margin-bottom:1em;text-shadow:0 1px 8px #000;}
  #wReveal .r-text{font-family:var(--serif);font-style:italic;font-size:clamp(17px,1.7vw,24px);line-height:1.7;color:rgba(240,238,250,.97);text-shadow:0 1px 10px #000,0 0 5px #000;}
  #wReveal .r-text.placeholder{color:rgba(212,216,236,.52);}
  #wReveal .r-field{margin-top:1.2em;width:100%;background:none;border:none;border-bottom:1px solid rgba(255,214,150,.42);outline:none;text-align:center;padding:.3em .2em .5em;
    font-family:var(--serif);font-style:italic;font-size:clamp(17px,1.6vw,23px);color:rgba(255,240,204,.98);
    text-shadow:0 0 14px rgba(255,204,120,.55),0 1px 8px #000;caret-color:rgba(255,220,150,.9);}
  #wReveal .r-field::placeholder{color:rgba(242,224,184,.62);}
  #wReveal .r-field:focus{border-bottom-color:rgba(255,226,172,.8);}
  #wReveal .r-done{font-family:var(--serif);font-style:italic;font-size:clamp(14px,1.2vw,17px);color:rgba(232,228,246,.85);opacity:0;transition:opacity 1.2s ease;text-shadow:0 1px 10px #000;margin-top:.6em;min-height:1.3em;}
  #wReveal .r-done.show{opacity:1;}
  #wReveal .r-close{margin-top:1.8em;font-family:var(--caps);font-size:clamp(8px,.7vw,10px);letter-spacing:.5em;text-transform:uppercase;color:rgba(202,206,230,.55);background:none;border:none;cursor:pointer;text-shadow:0 1px 8px #000;}
  #wReveal .r-pause{display:block;margin:1.4em auto 0;background:none;border:none;cursor:pointer;
    font-family:var(--serif);font-style:italic;font-size:clamp(16px,1.45vw,21px);color:rgba(246,232,204,.95);
    text-shadow:0 0 12px rgba(255,210,140,.4),0 1px 8px #000;transition:color .4s;
    text-decoration:underline;text-underline-offset:.4em;text-decoration-thickness:1px;text-decoration-color:rgba(255,212,150,.45);}
  #wReveal .r-pause:hover{color:rgba(255,236,196,1);}
  #wReveal .r-close:hover{color:var(--amber);}
  #wReveal .r-choice{margin-top:1.3em;display:flex;gap:2em;justify-content:center;flex-wrap:wrap;}
  #wReveal .r-opt{background:none;border:none;cursor:pointer;font-family:var(--serif);font-style:italic;
    font-size:clamp(15px,1.4vw,20px);color:rgba(240,228,200,.9);text-shadow:0 0 10px rgba(255,210,140,.3),0 1px 8px #000;transition:color .4s;}
  #wReveal .r-opt:hover{color:rgba(255,238,198,1);}
  #wReveal .r-grown{font-family:var(--serif);font-style:italic;font-size:clamp(15px,1.4vw,20px);color:rgba(228,240,220,.95);
    line-height:1.65;text-shadow:0 1px 10px #000,0 0 5px #000;}
  .field-light{position:absolute;width:4px;height:4px;border-radius:50%;background:rgba(188,255,196,.85);
    box-shadow:0 0 8px 2px rgba(150,240,168,.5);mix-blend-mode:screen;pointer-events:none;z-index:2;animation:fieldGlow 4.5s ease-in-out infinite;}
  @keyframes fieldGlow{0%,100%{opacity:.28}50%{opacity:.9}}
  #wHush{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity 2.6s ease;
    background:radial-gradient(ellipse at 50% 50%, transparent 26%, rgba(3,5,12,.55) 100%);}
  #wHush.show{opacity:1;}
  #wHushLine{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:4;pointer-events:none;text-align:center;
    font-family:var(--serif);font-style:italic;font-size:clamp(18px,1.8vw,26px);color:rgba(242,240,252,.94);
    text-shadow:0 1px 12px #000,0 0 6px #000;opacity:0;transition:opacity 2.6s ease;}
  #wHushLine.show{opacity:1;}
  #world.stilled .w-flame{animation-duration:7s;}
  /* return-to-wheel doorway, bottom-left — replaces the old text button,
     same visual pattern as the rest of the portal (Hearthfire/Apothecary/
     Oracle/Memory Hall), shared by all eight seasons since #world is reused. */
  #world .w-back{position:absolute;left:5%;bottom:5%;width:12vmin;height:12vmin;min-width:64px;min-height:64px;
    border-radius:50%;overflow:hidden;background:url('https://res.cloudinary.com/ds8pkprtb/image/upload/Season_wheel.png') center/cover no-repeat;
    border:none;font-size:0;color:transparent;text-indent:-9999px;
    opacity:.6;box-shadow:0 0 0 1px rgba(200,160,80,.25),0 0 18px rgba(200,150,70,.25);cursor:pointer;z-index:2;transition:opacity .6s ease,box-shadow .6s ease;}
  #world .w-back:hover,#world .w-back.active{opacity:1;box-shadow:0 0 0 2px rgba(220,180,100,.55),0 0 26px rgba(220,170,90,.45);}
  .shooting-star{position:fixed;width:220px;height:3px;pointer-events:none;z-index:830;transform-origin:left center;
    background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,248,226,1));filter:blur(.4px);opacity:0;
    box-shadow:0 0 14px 3px rgba(255,240,200,.8);}
  @keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(22deg) scaleX(.25)}10%{opacity:1}84%{opacity:1}100%{opacity:0;transform:translate(56vw,30vh) rotate(22deg) scaleX(1)}}
  /* words the visitor inscribed, drifting into the world — flown to the season's own anchor
     (stars, flame, veil, earth), not a generic up/down. --tx/--ty set by JS per destination (6 Jul 2026) */
  .drift-word{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:860;max-width:70vw;text-align:center;
    font-family:var(--serif);font-style:italic;font-size:clamp(18px,1.8vw,24px);color:rgba(255,244,220,.97);
    text-shadow:0 0 14px rgba(255,210,140,.5),0 1px 10px #000,0 0 5px #000;opacity:0;
    transition:opacity .7s ease, transform 3.2s ease-in-out;will-change:transform,opacity;}
  /* litha's inversion — the wish is CARRIED, not relinquished: the words come toward the visitor and go with them */

  .answer-burst.go{animation:answerBurst 4.2s ease-out forwards;}

    100%{opacity:0;transform:translate(-50%,-50%) scale(1.7)}}

  .answer-swell.veil{background:radial-gradient(ellipse at var(--ax,50%) var(--ay,30%), rgba(210,192,255,.55), rgba(160,145,240,.22) 38%, transparent 72%);}

  @keyframes answerSwell{0%{opacity:0}30%{opacity:1}62%{opacity:.75}100%{opacity:0}}

    100%{opacity:0;transform:translateY(-42vh) translateX(var(--amx,0px)) scale(.7)}}
  /* the season's answer, spoken low in the scene once the reaction has played — not inside the panel.
     Its own soft halo (glow-only, no scrim) so it reads over any render. */
  #wDoneLine{position:absolute;left:50%;bottom:12vh;transform:translateX(-50%);z-index:6;pointer-events:none;text-align:center;max-width:84vw;

  #wDoneLine::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:150%;height:280%;border-radius:50%;z-index:-1;filter:blur(14px);
    background:radial-gradient(ellipse at center, rgba(6,8,16,.7), rgba(6,8,16,.3) 50%, transparent 75%);}
  #wDoneLine.show{opacity:1;}
  /* TEMPORARY diagnostic stamp — proves which build the phone is receiving. REMOVE before deploy. */
  #buildStamp{position:fixed;right:2vmin;bottom:2vmin;z-index:950;pointer-events:none;
    font-family:var(--caps);font-size:9px;letter-spacing:.2em;color:rgba(180,190,220,.55);text-shadow:0 1px 6px #000;}
  #wWarm{position:absolute;inset:0;pointer-events:none;z-index:1;mix-blend-mode:screen;opacity:0;

  #wWarm.go{animation:warmFlarePulse 2.6s ease-out;}
  @keyframes warmFlarePulse{0%{opacity:0}22%{opacity:1}100%{opacity:0}}
  /* the fire moment — words rise in the firelight, no veil over the world */

  @keyframes flameSwell{0%{transform:translate(-50%,-50%) scale(1);opacity:.7}28%{transform:translate(-50%,-53%) scale(1.6);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:.7}}
  #wStrength{position:absolute;left:50%;top:55%;transform:translateX(-50%);width:min(82vw,560px);text-align:center;z-index:6;pointer-events:none;opacity:0;transition:opacity 1.4s ease;}
  #wStrength.show{opacity:1;}
  #wStrength::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:150%;height:220%;border-radius:50%;pointer-events:none;z-index:-1;filter:blur(14px);
    background:radial-gradient(ellipse at center, rgba(50,26,8,.55), rgba(28,14,6,.24) 46%, transparent 72%);}
  #wStrength .s-words{font-family:var(--serif);font-style:italic;font-size:clamp(17px,1.7vw,24px);line-height:1.7;color:rgba(255,244,220,.98);

  .fire-ember{position:absolute;width:4px;height:4px;border-radius:50%;background:rgba(255,202,124,.95);box-shadow:0 0 10px 3px rgba(255,150,60,.6);

  @keyframes fireRise{0%{opacity:0;transform:translateY(0) translateX(0)}15%{opacity:1}100%{opacity:0;transform:translateY(-170px) translateX(var(--fx,0))}}
  /* meaning — the returning light swells up through the dark */
  #wGlow{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0;mix-blend-mode:screen;

  #wGlow.go{animation:glowSwell 5s ease-in-out;}
  @keyframes glowSwell{0%{opacity:0}32%{opacity:1}100%{opacity:0}}

  @keyframes gatherKindle{0%{opacity:0;transform:scale(.4)}20%{opacity:.95;transform:scale(1)}80%{opacity:.7}100%{opacity:0}}
  /* offering — the buried seed glowing under the snow */
  .seed-light{position:absolute;width:12px;height:12px;border-radius:50%;background:rgba(194,255,204,.95);
    box-shadow:0 0 22px 7px rgba(150,240,172,.6);mix-blend-mode:screen;pointer-events:none;z-index:4;animation:seedPulse 6.3s ease-in-out forwards;}
  @keyframes seedPulse{0%{opacity:0;transform:scale(.3)}12%{opacity:1;transform:scale(1)}30%{opacity:.55;transform:scale(.8)}
    46%{opacity:1;transform:scale(1.15)}62%{opacity:.55;transform:scale(.85)}78%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(.9)}}
  .snowflake{position:absolute;top:-3%;border-radius:50%;background:rgba(255,255,255,.9);pointer-events:none;animation:snowFall var(--sf,10s) linear forwards;}
  @keyframes snowFall{0%{opacity:0;transform:translateY(0) translateX(0)}10%{opacity:.9}100%{opacity:.2;transform:translateY(106vh) translateX(var(--sx,20px))}}
  /* the tale — a cold silver memory sweeping through the scene when the tale-stone wakes */
  .tale-sweep{position:absolute;top:0;bottom:0;width:46vw;pointer-events:none;z-index:4;mix-blend-mode:screen;
    background:linear-gradient(100deg, transparent, rgba(175,200,240,.13) 35%, rgba(200,220,250,.2) 50%, rgba(175,200,240,.13) 65%, transparent);
    filter:blur(10px);animation:taleSweep 4.2s ease-in-out forwards;}
  @keyframes taleSweep{0%{left:-50vw;opacity:0}18%{opacity:1}82%{opacity:1}100%{left:105vw;opacity:0}}
  .tale-past{opacity:.55;font-size:.9em;}
  #rChoiceLine{font-family:var(--serif);font-style:italic;font-size:clamp(14px,1.3vw,18px);line-height:1.6;color:rgba(235,240,255,.92);text-shadow:0 1px 8px rgba(0,0,0,.8);margin-bottom:.9em;display:none;}
  /* the fragment — a recovered archive unearthed in-scene (Ostara's Eostre discovery).

  #wFragment{position:absolute;inset:0;z-index:7;display:none;overflow:hidden;padding:6vh 6vw;}
  #wFragment.show{display:block;}
  #wFragment .f-inner{max-width:620px;margin:0 auto;text-align:center;position:relative;height:100%;box-sizing:border-box;
    display:flex;flex-direction:column;justify-content:center;padding:2em 1.4em;}
  #wFragment .f-inner::before{content:'';position:absolute;inset:-6%;border-radius:26px;z-index:-1;filter:blur(8px);

  #wFragment .f-head{font-family:var(--caps);font-size:clamp(9px,.8vw,11px);letter-spacing:.42em;text-transform:uppercase;color:rgba(228,200,150,.85);line-height:2;margin-bottom:1.2em;}

  #wFragment.show .f-img{opacity:1;transform:none;}

  #wFragment .f-page-text{box-sizing:border-box;height:38vh;min-height:200px;overflow:hidden;position:relative;padding:0 .2em;
    font-family:var(--serif);font-size:clamp(15px,1.35vw,19px);line-height:1.85;color:rgba(238,242,252,.95);text-shadow:0 1px 10px rgba(0,0,0,.85);text-align:center;}
  #wFragment .f-page-text p{margin:0 0 1.1em;}
  #wFragment .f-nav{display:flex;align-items:center;justify-content:center;gap:1.6em;margin-top:.8em;}

  #wFragment .f-arrow:hover{color:var(--amber);}

  #wFragment .f-count{font-family:var(--caps);font-size:clamp(8px,.7vw,10px);letter-spacing:.3em;color:rgba(210,220,240,.55);}
  #wFragment .f-close{display:inline-block;margin:1.2em auto 0;font-family:var(--caps);font-size:clamp(8px,.7vw,10px);letter-spacing:.5em;text-transform:uppercase;color:rgba(210,220,240,.65);cursor:pointer;}
  @keyframes deepBreath{0%{transform:scale(1.04)}45%{transform:scale(1.085)}100%{transform:scale(1.04)}}
  #world.breathing .w-bg{animation:deepBreath 7s ease-in-out 1;}
  /* leaf — Mabon's air: russet flakes that sway as they fall */
  .leaffall{position:absolute;top:-3%;border-radius:60% 40% 55% 45%;pointer-events:none;

  @keyframes leafFall{0%{opacity:0;transform:translateY(0) translateX(0) rotate(0deg)}8%{opacity:.9}

    100%{opacity:.15;transform:translateY(106vh) translateX(var(--lx2,-20px)) rotate(420deg)}}
  /* frost — southern midwinter air: slow silver glints that twinkle as they drift */
  .frostglint{position:absolute;top:-3%;border-radius:50%;background:rgba(222,236,255,.9);box-shadow:0 0 6px 1px rgba(190,215,255,.5);mix-blend-mode:screen;pointer-events:none;animation:frostDrift var(--ff,16s) linear forwards;opacity:0;}
  @keyframes frostDrift{0%{opacity:0;transform:translateY(0) translateX(0)}12%{opacity:.8}46%{opacity:.25}68%{opacity:.75}100%{opacity:0;transform:translateY(104vh) translateX(var(--fxs,14px))}}
  .warmmote{position:absolute;bottom:-3%;width:3px;height:3px;border-radius:50%;background:rgba(255,220,150,.9);box-shadow:0 0 7px 2px rgba(255,190,90,.45);mix-blend-mode:screen;pointer-events:none;animation:warmRise var(--wr,11s) linear forwards;opacity:0;}
  @keyframes warmRise{0%{opacity:0;transform:translateY(0)}14%{opacity:.85}100%{opacity:0;transform:translateY(-106vh) translateX(var(--wx,30px))}}

  .mote{position:fixed;width:3px;height:3px;border-radius:50%;background:rgba(255,210,150,.85);box-shadow:0 0 7px 2px rgba(255,170,80,.45);pointer-events:none;z-index:9;mix-blend-mode:screen;animation:moteRise var(--md,8s) linear infinite;opacity:0;}
  @keyframes moteRise{0%{opacity:0;transform:translateY(0)}14%{opacity:.9}100%{opacity:0;transform:translateY(-64px) translateX(var(--mx,10px))}}
  /* embers riding the wind across the whole clearing */
  .wind-ember{position:fixed;width:2.5px;height:2.5px;border-radius:50%;background:rgba(255,204,140,.8);
    box-shadow:0 0 6px 1px rgba(255,170,80,.4);pointer-events:none;z-index:7;mix-blend-mode:screen;
    animation:windDrift var(--wd,12s) linear forwards;opacity:0;}
  @keyframes windDrift{0%{opacity:0;transform:translate(0,0)}14%{opacity:.85}80%{opacity:.55}100%{opacity:0;transform:translate(var(--wdx,120px),var(--wdy,-90px))}}

  /* hemisphere toggle */
  #hemi{position:fixed;bottom:3vmin;right:3.4vmin;z-index:30;font-family:var(--caps);font-size:clamp(7px,.66vw,9px);letter-spacing:.32em;text-transform:uppercase;color:rgba(170,186,214,.4);display:flex;gap:.5em;}

  #hemi button.on{color:var(--amber);}#hemi button:hover{color:rgba(220,205,165,.85);}

  /* calibration aid: open with ?calib=1, move mouse, read the % to tell me */
  #calib{position:fixed;top:8px;right:8px;z-index:999;font-family:monospace;font-size:12px;color:#ffd27a;background:rgba(0,0,0,.6);padding:4px 8px;border-radius:4px;display:none;}

  /* ——— LEGIBLE-TEXT STANDARD (locked 8 Jul 2026) — floors lifted, placed last. #roomLabel left atmospheric. ——— */
  /* reading */
  #whisper{font-size:clamp(17px,1.3vw,19px);}

<script>
(function(){
  'use strict';

  /* The eight turns — fixed seasonal order, Yule at the crown. s/n = [month,day]. */
  var WHEEL=[

        body:["They named her.","That is where the error begins.","In the outer records, beyond the Veil, there exists a singular reference. A monk, meticulous in his chronicling, recorded the passing of a month and attached to it a name.","Ēostre.","A goddess, he presumed. A figure to be honoured. A relic of a fading belief.","He did not know what he was preserving.","There is no singular presence bound to that name.","No throne. No dominion. No fixed form within the Loom.","What was witnessed was not a being.","It was a moment.","At the close of deep winter, when the Resonance runs thin and threads fall quiet, there comes a subtle disturbance. Not rupture. Not fracture.","A softening.","Threads long dormant begin to hum, not yet in harmony, but in memory of it. The Everflame does not rise in strength, but shifts in warmth, as though recalling something it had almost forgotten.","This is the first sign.","Those who listen too quickly will miss it. Those who listen too closely will mistake it for error.","Only the still ones… only the patient… hear what follows.","A call.","Not sung, as a Threadsinger would sing. Not woven, as the Loom is woven.","But something in between.","A resonance that does not command the threads, but invites them.","Across the northern reaches, this call is known as awakening.","Frost loosens its hold. Sap begins its slow ascent. Creatures stir, uncertain at first, as though remembering how to live.","Life does not return all at once.","It leans forward.","Yet at that same turning, in lands where the sun begins to retreat, the same presence moves differently.","There, it is not awakening.","It is release.","The air deepens. The earth exhales. The final fruits are gathered, and what must sleep is gently guided toward rest.","Nothing is taken.","Everything is allowed.","They believed these to be separate forces.","They were wrong.","It is one threshold. One presence.","Not bound by season, but by change itself.","Among the oldest Threadsingers, there are whispers of it.","They do not name it. To name it is to reduce it.","But they recognise the tremor when it comes.","Some step back from the Loom in reverence. Others attempt, foolishly, to follow its pattern.","None have succeeded.","It does not weave. It does not mend. It does not choose.","It creates the conditions in which choice becomes possible.","There are records, fragmented and unreliable, that suggest its influence extends beyond the turning of seasons.","Moments of unexpected union. Paths crossing where none should have met. The sudden, inexplicable knowing that something must begin… or end.","These are often attributed to chance.","They are not.","The outer scholars, in their limited understanding, preserved only a name.","Ēostre.","A sound. An echo. A misinterpretation of something they could neither see nor comprehend.","Let the record stand corrected.","She is not a goddess. She is not singular. She is not bound to form.","She is the breath between states.","The loosening of what was held.","The quiet permission for what comes next.","And when the world turns…","she is already there."]},

  function paginateFragmentBody(paragraphs){

      +'font-family:'+cs.fontFamily+';font-size:'+cs.fontSize+';line-height:'+cs.lineHeight+';text-align:'+cs.textAlign+';';
    document.body.appendChild(meas);

    if(!cover) tp.innerHTML=fragPages[fragIdx]||'';
    document.getElementById('fPrev').classList.toggle('hidden',fragIdx<=-1);
    document.getElementById('fNext').classList.toggle('hidden',fragIdx>=fragPages.length-1);
    document.getElementById('fCount').textContent=cover?'':(fragIdx+1)+' / '+fragPages.length;
  }
  document.getElementById('fPrev').addEventListener('click',function(){
    if(fragIdx>-1){ fragIdx--; renderFragPage(); }
  });
  document.getElementById('fNext').addEventListener('click',function(){
    if(fragIdx<fragPages.length-1){ fragIdx++; renderFragPage(); }
  });
  document.getElementById('fClose').addEventListener('click',closeFragment);
  // the fire moment — in-scene, no veil
  function openFire(){
    var cfg=worldCfg(curWorld)||{};
    closeReveal();
    document.getElementById('sWords').textContent = cfg.strength || '⟡ your words · the strength the fire gives';
    warmFlare();
    var fl=document.getElementById('wFlame');
    if(cfg.fire&&fl){ fl.classList.add('flare'); setTimeout(function(){ fl.classList.remove('flare'); }, 2800); }
    fireEmbers();
    document.getElementById('wStrength').classList.add('show');
  }
  function closeFire(){ document.getElementById('wStrength').classList.remove('show'); }
  function fireEmbers(){
    var cfg=worldCfg(curWorld)||{}; var src=cfg.fire||cfg.ember||{x:50,y:85}; var fx=src.x, fy=src.y;
    var host=document.getElementById('world');
    for(var i=0;i<16;i++){ (function(){ setTimeout(function(){
      if(!worldOpen)return;
      var e=document.createElement('div'); e.className='fire-ember';
      e.style.left=(fx+(Math.random()*8-4))+'%'; e.style.top=(fy+(Math.random()*4-2))+'%';
      e.style.setProperty('--fx',(Math.random()*44-22)+'px'); e.style.setProperty('--fd',(2.6+Math.random()*2)+'s');
      host.appendChild(e); setTimeout(function(){e.remove();},5200);
    }, i*85); })(); }
  }
  function closeWorld(){document.getElementById('world').classList.remove('show');worldOpen=false;closeFire();closeFragment();if(worldParticleTimer){clearInterval(worldParticleTimer);worldParticleTimer=null;}}
  function startWorldParticles(type){
    if(worldParticleTimer)clearInterval(worldParticleTimer);
    var host=document.getElementById('wParticles');
    worldParticleTimer=setInterval(function(){
      if(!worldOpen||worldStilled)return;
      if(type==='snow'){
        var s=document.createElement('div');s.className='snowflake';
        var sz=1.5+Math.random()*3;s.style.width=sz+'px';s.style.height=sz+'px';
        s.style.left=(Math.random()*100)+'%';s.style.setProperty('--sf',(7+Math.random()*7)+'s');
        s.style.setProperty('--sx',(Math.random()*60-30)+'px');s.style.opacity=(.4+Math.random()*.5);
        host.appendChild(s);setTimeout(function(){s.remove();},14000);
      }else if(type==='leaf'){
        if(Math.random()<.55)return; /* unhurried — a wood letting go, not a storm */
        var lf=document.createElement('div');lf.className='leaffall';
        var lz=5+Math.random()*6;lf.style.width=lz+'px';lf.style.height=(lz*.75)+'px';
        lf.style.left=(Math.random()*100)+'%';lf.style.setProperty('--lf',(10+Math.random()*8)+'s');
        lf.style.setProperty('--lx1',(Math.random()*70-35)+'px');lf.style.setProperty('--lx2',(Math.random()*70-35)+'px');
        host.appendChild(lf);setTimeout(function(){lf.remove();},19000);
      }else if(type==='frost'){
        if(Math.random()<.5)return; /* sparser than snow — frost hangs, it doesn't fall */
        var g=document.createElement('div');g.className='frostglint';
        var gz=1+Math.random()*2;g.style.width=gz+'px';g.style.height=gz+'px';
        g.style.left=(Math.random()*100)+'%';g.style.setProperty('--ff',(12+Math.random()*8)+'s');
        g.style.setProperty('--fxs',(Math.random()*40-20)+'px');
        host.appendChild(g);setTimeout(function(){g.remove();},21000);
      }else{
        if(Math.random()<.6)return; /* unhurried drift, not a flurry (Ange, 6 Jul 2026) */
        var m=document.createElement('div');m.className='warmmote';
        m.style.left=(Math.random()*100)+'%';m.style.setProperty('--wr',(14+Math.random()*8)+'s');
        m.style.setProperty('--wx',(Math.random()*50-25)+'px');
        host.appendChild(m);setTimeout(function(){m.remove();},24000);
      }
    },300);
  }
  document.getElementById('throughBack').addEventListener('click',function(){document.getElementById('through').classList.remove('show');});
  /* iOS ghost-tap guard — a tap re-fired just after the keyboard closes can land on this
     button and silently close the world mid-ritual (6 Jul 2026) */
  document.getElementById('wBack').addEventListener('click',function(){
    if(Date.now()-lastFieldBlur<900)return;
    closeWorld();
  });
  document.getElementById('wBack').addEventListener('touchstart',function(){this.classList.add('active');},{passive:true});
  document.getElementById('wBack').addEventListener('touchend',function(){var el=this;setTimeout(function(){el.classList.remove('active');},800);});
  document.getElementById('rClose').addEventListener('click',closeReveal);
  document.getElementById('rPause').addEventListener('click',startStillness);
  document.getElementById('wReveal').addEventListener('click',function(e){if(e.target===this)closeReveal();});
  /* one release path for both the return key and the in-world tap (6 Jul 2026) */
  function releaseWords(){
    var f=document.getElementById('rField');
    var t=f.value.trim(); if(!t)return;
    stamp('released');
    pendingBody=t; f.style.display='none'; f.blur();
    document.getElementById('rRelease').style.display='none';
    showChoice();
  }
  document.getElementById('rField').addEventListener('keydown',function(e){
    if(e.key!=='Enter')return; e.preventDefault();
    releaseWords();
  });
  document.getElementById('rField').addEventListener('input',function(){
    if(this.value.trim())stamp('words written');
    document.getElementById('rRelease').style.display=this.value.trim()?'':'none';
  });
  document.getElementById('rField').addEventListener('blur',function(){lastFieldBlur=Date.now();});
  document.getElementById('rRelease').addEventListener('click',releaseWords);
  /* the commit — restaged 6 Jul 2026 so the reaction owns the stage.
     Sequence: panel melts away → the words fly to the season's own anchor → the season
     answers there (star/flame/veil/bloom/seed) → the done-line speaks low in the scene →
     only then do the stones return. Cause, then effect, then confirmation. */
  function hotspotPoint(type,cfg){
    var hs=cfg.hotspots||[]; for(var i=0;i<hs.length;i++) if(hs[i].type===type) return {x:hs[i].x,y:hs[i].y};
    return null;
  }
  function commitPlanting(isPublic){
    var type=document.getElementById('wReveal').dataset.type; var kind=type==='wish'?'wish':'seed';
    var body=pendingBody; pendingBody='';
    stamp('received');
    savePlanting(curWorld,kind,body,isPublic);
    hideChoice();
    var wc=worldCfg(curWorld)||{};
    /* the panel goes first — hotspots stay hidden (reading) until the moment has played out */
    document.getElementById('wReveal').classList.remove('show');
    var doneText,fx,tgt;
    if(kind==='wish'){
      doneText=wc.wishDone||'the stars hold your wish';
      fx=wc.wishFx||'star';
      tgt=(fx==='flame'&&wc.fire)?{x:wc.fire.x,y:wc.fire.y}
         :(fx==='carry')?{x:50,y:42}
         :(hotspotPoint('wish',wc)||{x:50,y:16});
    }else{
      doneText=wc.restLine||(state.hemi==='south'?'it rests in the cold earth, to grow':'it rests beneath the snow, to grow');
      fx='seed';
      var ap=hotspotPoint('act',wc)||{x:50,y:84};
      tgt={x:ap.x,y:Math.min(ap.y+6,92)};
    }
    spawnDriftTo(body,tgt,fx,function(){ landReaction(fx,tgt); });
    setTimeout(function(){
      if(!worldOpen)return;
      var dl=document.getElementById('wDoneLine'); dl.textContent=doneText; dl.classList.add('show');
      setTimeout(function(){ dl.classList.remove('show'); },4500);
    },2600);
    setTimeout(function(){
      if(worldOpen && !document.getElementById('wReveal').classList.contains('show')){
        document.getElementById('world').classList.remove('reading');
        if(pendingRefresh){pendingRefresh=false; refreshWorld();}
      }
    },7200);
  }
  /* the flight is a plain transition, not a keyframe — calc()+var() inside keyframe
     transforms misfires on some iOS Safari versions (6 Jul 2026, Ange's phone test) */
  function spawnDriftTo(t,tgt,fx,cb){
    var host=document.getElementById('world');
    var e=document.createElement('div'); e.className='drift-word'; e.textContent=t;
    e.style.left='50%'; e.style.top='50%';
    if(fx==='carry'){ e.classList.add('carry'); host.appendChild(e); }
    else{
      var r=host.getBoundingClientRect();
      var dx=((tgt.x-50)/100*r.width).toFixed(1), dy=((tgt.y-50)/100*r.height).toFixed(1);
      host.appendChild(e);
      requestAnimationFrame(function(){requestAnimationFrame(function(){
        e.style.opacity='1';
        e.style.transform='translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px)) scale(.6)';
      });});
      setTimeout(function(){ e.style.opacity='0'; },2400);
    }
    setTimeout(function(){ if(cb)cb(); },2500);
    setTimeout(function(){e.remove();},3800);
  }
  /* THE ANSWER — one engine, every spoke (6 Jul 2026). Three beats, identical everywhere:
     the words arrive → a white-core burst + scene swell no render can swallow → wishes
     release a rising mote-column, offerings wake the earth with a triple seed pulse.
     Per-season flavour (star/flame/veil-tint/carry) rides on top; a spoke with no flavour
     configured still answers in full. Config supplies only coordinates. */
  function landReaction(fx,tgt){
    if(!worldOpen){ stamp('world closed before answer'); return; }
    stamp('answered: '+fx);
    var host=document.getElementById('world');
    var tint=(fx==='veil')?' veil':(fx==='seed')?' seed':'';
    var b=document.createElement('div'); b.className='answer-burst'+tint;
    b.style.left=tgt.x+'%'; b.style.top=tgt.y+'%';
    host.appendChild(b); void b.offsetWidth; b.classList.add('go');
    setTimeout(function(){b.remove();},4400);
    var sw=document.createElement('div'); sw.className='answer-swell'+tint;
    sw.style.setProperty('--ax',tgt.x+'%'); sw.style.setProperty('--ay',tgt.y+'%');
    host.appendChild(sw); void sw.offsetWidth; sw.classList.add('go');
    setTimeout(function(){sw.remove();},4900);
    if(fx==='seed'){
      buriedSeed(tgt);
    }else{
      for(var i=0;i<14;i++){(function(){setTimeout(function(){
        if(!worldOpen)return;
        var m=document.createElement('div'); m.className='answer-mote'+(fx==='veil'?' veil':'');
        m.style.left=(tgt.x+(Math.random()*10-5))+'%'; m.style.top=(tgt.y+(Math.random()*4-2))+'%';
        m.style.setProperty('--amx',(Math.random()*56-28)+'px');
        m.style.setProperty('--amd',(2.6+Math.random()*1.8)+'s');
        host.appendChild(m); setTimeout(function(){m.remove();},4800);
      },Math.random()*1400);})();}
    }
    if(fx==='star'){ spawnShootingStar(tgt); setTimeout(function(){ if(worldOpen)spawnShootingStar(); },1500); }
    else if(fx==='flame'){
      var fl=document.getElementById('wFlame');
      if(fl&&fl.style.display!=='none'){ fl.classList.remove('flare'); void fl.offsetWidth; fl.classList.add('flare'); setTimeout(function(){fl.classList.remove('flare');},2900); }
      fireEmbers();
    }
    else if(fx==='carry'){ warmFlare(); }
  }
  document.getElementById('sClose').addEventListener('click',closeFire);
  document.getElementById('rOptPublic').addEventListener('click',function(){commitPlanting(true);});
  document.getElementById('rOptPrivate').addEventListener('click',function(){commitPlanting(false);});

  /* ember motes near the living station */
  var moteTimer=null;
  function seedMotes(){
    if(moteTimer) clearInterval(moteTimer);
    moteTimer=setInterval(function(){
      var stage=document.getElementById('stage').getBoundingClientRect();
      var p=activePOS()[0];   // the lit season is always crowned at slot 0 (the peak well)
      var m=document.createElement('div');m.className='mote';
      m.style.left=(stage.left+stage.width*(p.x/100)+(Math.random()*30-15))+'px';
      m.style.top=(stage.top+stage.height*(p.y/100)+(Math.random()*20-10))+'px';
      m.style.setProperty('--md',(5+Math.random()*4)+'s');
      m.style.setProperty('--mx',(Math.random()*24-12)+'px');
      document.body.appendChild(m);
      setTimeout(function(){m.remove();},9000);
    },560);
  }

  /* embers riding the wind across the clearing */
  function startWindEmbers(){
    setInterval(function(){
      var e=document.createElement('div');e.className='wind-ember';
      e.style.left=(Math.random()*window.innerWidth)+'px';
      e.style.top=(window.innerHeight*(0.5+Math.random()*0.45))+'px';
      var dur=10+Math.random()*6;
      e.style.setProperty('--wd',dur+'s');
      e.style.setProperty('--wdx',(60+Math.random()*130)+'px');
      e.style.setProperty('--wdy',(-(60+Math.random()*130))+'px');
      document.body.appendChild(e);
      setTimeout(function(){e.remove();},(dur+0.6)*1000);
    },900);
  }

  /* hemisphere toggle */
  document.getElementById('hSouth').addEventListener('click',function(){state.hemi='south';setHemi('south');render();});
  document.getElementById('hNorth').addEventListener('click',function(){state.hemi='north';setHemi('north');render();});

  /* ——— navigation ——— */
  function navigateTo(href){var c=document.getElementById('fadeCover');c.style.transition='opacity 1.4s ease';c.style.opacity='1';setTimeout(function(){window.location.href=href;},1500);}
  function logTrail(name,href){var t=JSON.parse(sessionStorage.getItem('aetherwood_trail')||'[]');t=t.filter(function(e){return e.href!==href;});t.unshift({name:name,href:href});if(t.length>8)t=t.slice(0,8);sessionStorage.setItem('aetherwood_trail',JSON.stringify(t));}
  logTrail('the year wheel','year-wheel.html');
  var EF_ANCHORS=['hearthfire.html','whispered-archives.html'];var efOpen=false;
  function buildTrail(){var efT=document.getElementById('efTrail'),efL=document.getElementById('efTrailList');
    var t=JSON.parse(sessionStorage.getItem('aetherwood_trail')||'[]').filter(function(e){return e.href!=='year-wheel.html'&&EF_ANCHORS.indexOf(e.href)===-1;});
    if(!t.length){efT.style.display='none';return;}efT.style.display='';efL.innerHTML='';
    t.slice(0,3).forEach(function(e){var li=document.createElement('li');li.className='ef-item';var b=document.createElement('button');b.className='ef-link';b.textContent=e.name;b.addEventListener('click',function(){closeEf();navigateTo(e.href);});li.appendChild(b);efL.appendChild(li);});}
  function openEf(){buildTrail();document.getElementById('efMenu').classList.add('open');document.getElementById('efScrim').classList.add('open');efOpen=true;}
  function closeEf(){document.getElementById('efMenu').classList.remove('open');document.getElementById('efScrim').classList.remove('open');efOpen=false;}
  var ef=document.getElementById('everflame');
  ef.addEventListener('click',function(){efOpen?closeEf():openEf();});
  ef.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();efOpen?closeEf():openEf();}});
  document.getElementById('efScrim').addEventListener('click',closeEf);
  document.getElementById('efArchives').addEventListener('click',function(){closeEf();navigateTo('whispered-archives.html');});
  document.getElementById('efHearthfire').addEventListener('click',function(){closeEf();navigateTo('hearthfire.html');});
  document.getElementById('efCorridor').addEventListener('click',function(){closeEf();navigateTo('vestibule.html?walk=1');});
  document.getElementById('efLeave').addEventListener('click',function(){closeEf();navigateTo('index.html');});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeEf();document.getElementById('through').classList.remove('show');closeWorld();}});

  /* ——— calibration aid (?calib=1) ——— */
  if(/[?&]all=1/.test(location.search)){ document.getElementById('stations').classList.add('reveal'); }
  if(/[?&]calib=1/.test(location.search)){
    var box=document.getElementById('calib'),cross=document.getElementById('calibCross'),stg=document.getElementById('stage'),wld=document.getElementById('world');
    box.style.display='block';cross.style.display='block';
    function updEl(el,cx,cy){var r=el.getBoundingClientRect();var px=((cx-r.left)/r.width*100),py=((cy-r.top)/r.height*100);box.textContent='x:'+px.toFixed(1)+'%  y:'+py.toFixed(1)+'%';cross.style.left=px+'%';cross.style.top=py+'%';}
    stg.addEventListener('mousemove',function(e){updEl(stg,e.clientX,e.clientY);});
    stg.addEventListener('touchmove',function(e){if(e.touches[0])updEl(stg,e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
    wld.addEventListener('mousemove',function(e){updEl(wld,e.clientX,e.clientY);});
    wld.addEventListener('touchmove',function(e){if(e.touches[0])updEl(wld,e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
  }

  /* ——— boot ——— */
  function init(){
    setTimeout(function(){document.getElementById('fadeCover').style.opacity='0';},120);
    render();
    startWindEmbers();
    portraitMQ.addEventListener('change', render);
    portraitMQ.addEventListener('change', refreshWorld);
    setTimeout(function(){var al=document.getElementById('arrivalLine');al.style.opacity='1';setTimeout(function(){al.style.opacity='0';},3400);},1000);
  }
  window.navigateTo=navigateTo;
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</body>
</html>
