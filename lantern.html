<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetherwood — The Lantern</title>

  <!-- Open Graph -->
  <meta property="og:type"        content="website">
  <meta property="og:url"         content="https://aetherwood.au/lantern">
  <meta property="og:title"       content="Aetherwood — The Lantern">
  <meta property="og:description" content="In the stillness / With shadow fallen behind / A light emerges — a glimmer, a promise of all that is to come.">
  <meta property="og:image"       content="https://res.cloudinary.com/ds8pkprtb/image/upload/aetherwood/portal/lantern.jpg">
  <meta property="og:image:width" content="1024">
  <meta property="og:image:height" content="1024">

  <!-- Twitter / X Card -->
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="Aetherwood — The Lantern">
  <meta name="twitter:description" content="In the stillness / With shadow fallen behind / A light emerges — a glimmer, a promise of all that is to come.">
  <meta name="twitter:image"       content="https://res.cloudinary.com/ds8pkprtb/image/upload/aetherwood/portal/lantern.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; min-height: 100%;
      background: #060305;
      color: rgba(228, 208, 158, 0.92);
      font-family: 'Cormorant Garamond', Georgia, serif;
      overflow-x: hidden;
    }

    /* ——— PAGE ——— */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8vh 6vw 10vh;
      animation: pageRise 2.8s ease 0.2s both;
    }

    @keyframes pageRise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ——— LANTERN IMAGE ——— */
    .lantern-wrap {
      position: relative;
      width: min(70vw, 460px);
      aspect-ratio: 1 / 1;
      margin-bottom: 4.5vh;
      flex-shrink: 0;
    }

    .lantern-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Fade image edges into page background */
    .lantern-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at center, transparent 38%, rgba(6,3,5,0.7) 72%, #060305 100%),
        linear-gradient(to bottom, #060305 0%, transparent 12%, transparent 82%, #060305 100%);
      pointer-events: none;
    }

    /* ——— MOON PHASE LABEL ——— */
    .moon-phase {
      font-size: clamp(10px, 1.1vw, 12px);
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(195, 168, 108, 0.48);
      margin-bottom: 4vh;
      text-align: center;
    }

    /* ——— POEM ——— */
    .poem {
      text-align: center;
      max-width: min(90vw, 440px);
      margin-bottom: 7vh;
    }

    .poem-line {
      display: block;
      font-size: clamp(16px, 2.1vw, 21px);
      font-style: italic;
      font-weight: 300;
      line-height: 1.95;
      color: rgba(238, 218, 165, 0.93);
      letter-spacing: 0.03em;
    }

    .poem-break {
      display: block;
      height: 1em;
    }

    /* ——— PORTAL CTA ——— */
    /* Uncomment and set href when the portal is live */
    .portal-cta {
      display: block;
      font-size: clamp(10px, 1vw, 11px);
      letter-spacing: 0.36em;
      text-transform: uppercase;
      color: rgba(195, 168, 108, 0.42);
      text-decoration: none;
      margin-bottom: 7vh;
      transition: color 1s ease;
    }
    .portal-cta:hover { color: rgba(228, 200, 135, 0.82); }

    /* ——— WORDMARK ——— */
    .wordmark {
      font-size: clamp(10px, 1.1vw, 13px);
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: rgba(175, 150, 95, 0.28);
      text-align: center;
    }

    /* ——— SOLSTICE FEATURE ——— */
    .solstice-section {
      text-align: center;
      max-width: min(90vw, 440px);
      margin-bottom: 6vh;
      animation: pageRise 2.8s ease 0.6s both;
    }

    .solstice-eyebrow {
      font-size: clamp(9px, 0.9vw, 11px);
      letter-spacing: 0.48em;
      text-transform: uppercase;
      color: rgba(210, 170, 80, 0.6);
      margin-bottom: 1.2em;
    }

    .solstice-invite {
      font-size: clamp(15px, 1.8vw, 18px);
      font-style: italic;
      font-weight: 300;
      line-height: 1.85;
      color: rgba(238, 218, 165, 0.82);
      margin-bottom: 2.2em;
    }

    .solstice-choice {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .solstice-btn {
      background: none;
      border: 1px solid rgba(210, 170, 80, 0.32);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(10px, 1vw, 12px);
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: rgba(210, 170, 80, 0.72);
      padding: 10px 28px;
      cursor: pointer;
      transition: color 0.4s ease, border-color 0.4s ease;
    }
    .solstice-btn:hover {
      color: rgba(242, 208, 120, 1);
      border-color: rgba(242, 208, 120, 0.55);
    }
    .sc-draw-again {
      margin-top: 0.4em;
    }
    .sc-season-label {
      font-size: clamp(9px, 0.85vw, 10px);
      letter-spacing: 0.48em;
      text-transform: uppercase;
      color: rgba(195, 168, 108, 0.45);
      margin-bottom: 1.6em;
    }

    /* Crystal reveal */
    .solstice-crystal {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0;
      opacity: 0;
      transition: opacity 1.2s ease;
      margin-top: 2.6em;
    }
    .solstice-crystal.visible { display: flex; }
    .solstice-crystal.faded   { opacity: 1; }

    .sc-img-wrap {
      width: min(44vw, 180px);
      aspect-ratio: 2 / 3;
      overflow: hidden;
      margin-bottom: 1.8em;
      position: relative;
    }
    .sc-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.92) sepia(0.08);
    }
    .sc-img-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(6,3,5,0.55) 100%);
      pointer-events: none;
    }

    .sc-world-name {
      font-size: clamp(22px, 2.6vw, 28px);
      font-style: italic;
      font-weight: 300;
      color: rgba(242, 220, 155, 0.97);
      letter-spacing: 0.04em;
      margin-bottom: 0.2em;
    }
    .sc-real-name {
      font-size: clamp(9px, 0.85vw, 11px);
      letter-spacing: 0.44em;
      text-transform: uppercase;
      color: rgba(185, 155, 88, 0.52);
      margin-bottom: 1.5em;
    }
    .sc-meaning {
      font-size: clamp(14px, 1.5vw, 16px);
      font-style: italic;
      color: rgba(228, 205, 148, 0.88);
      margin-bottom: 1.4em;
    }
    .sc-supports {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 10px;
      margin-bottom: 1.6em;
    }
    .sc-support-chip {
      font-size: clamp(9px, 0.82vw, 10px);
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: rgba(195, 165, 98, 0.62);
      border: 1px solid rgba(195, 165, 98, 0.22);
      padding: 4px 10px;
    }
    .sc-reflection {
      font-size: clamp(13px, 1.4vw, 15px);
      font-style: italic;
      color: rgba(210, 185, 120, 0.7);
      margin-bottom: 2.2em;
    }
    .sc-cta {
      font-size: clamp(9px, 0.9vw, 11px);
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(195, 168, 108, 0.45);
      text-decoration: none;
      transition: color 0.4s ease;
    }
    .sc-cta:hover { color: rgba(228, 200, 135, 0.85); }

    .sc-divider {
      width: 40px;
      height: 1px;
      background: rgba(210, 170, 80, 0.2);
      margin: 0 auto 2.4em;
    }

    /* ——— MOBILE ——— */
    @media (max-width: 600px) {
      .lantern-wrap { width: min(88vw, 380px); }
    }

    /* ——————————————————————————————————————
       LEGIBLE-TEXT STANDARD (locked 8 Jul 2026)
       Floors lifted to spec; placed last so it wins. .wordmark left atmospheric.
    —————————————————————————————————————— */
    /* reading (17px floor) */
    .poem-line       { font-size: clamp(17px, 2vw, 21px); }
    .solstice-invite { font-size: clamp(17px, 1.6vw, 18px); }
    .sc-meaning      { font-size: clamp(17px, 1.4vw, 18px); }
    .sc-reflection   { font-size: clamp(17px, 1.3vw, 18px); }
    /* buttons + CTAs (12–14px, tracking trimmed) */
    .portal-cta      { font-size: clamp(12px, 1.05vw, 13px); letter-spacing: 0.3em; }
    .solstice-btn    { font-size: clamp(12px, 1.05vw, 14px); letter-spacing: 0.28em; }
    .sc-cta          { font-size: clamp(12px, 1vw, 13px); letter-spacing: 0.3em; }
    /* names, eyebrows, small-caps labels (12–13px floor) */
    .moon-phase      { font-size: clamp(12px, 1vw, 13px); }
    .solstice-eyebrow{ font-size: clamp(12px, 1vw, 13px); }
    .sc-season-label { font-size: clamp(12px, 1vw, 13px); }
    .sc-real-name    { font-size: clamp(12px, 1vw, 13px); }
    .sc-support-chip { font-size: clamp(12px, 1vw, 13px); }
  </style>
  <script src="sound-control.js"></script>
</head>
<body>
  <div class="page">

    <div class="lantern-wrap">
      <img src="https://res.cloudinary.com/ds8pkprtb/image/upload/aetherwood/portal/lantern.jpg" alt="A lantern burning in a stone arch deep within Aetherwood">
    </div>

    <div class="moon-phase" id="moonPhase"></div>

    <div class="poem" id="poem"></div>

    <!-- SOLSTICE FEATURE — visible June 18–24 -->
    <div class="solstice-section" id="solsticeSection" style="display:none">
      <p class="solstice-eyebrow">the solstice · June 21</p>
      <p class="solstice-invite">The wheel turns at the same moment for all of us.<br>Which threshold are you crossing?</p>
      <div class="solstice-choice" id="solsticeChoice">
        <button class="solstice-btn" id="btnLight">I am greeting the light</button>
        <button class="solstice-btn" id="btnDark">I am welcoming the dark</button>
      </div>

      <div class="solstice-crystal" id="solsticeCrystal">
        <div class="sc-divider"></div>
        <p class="sc-season-label" id="scSeasonLabel"></p>
        <div class="sc-img-wrap">
          <img id="scImg" src="" alt="">
        </div>
        <p class="sc-world-name" id="scWorldName"></p>
        <p class="sc-real-name" id="scRealName"></p>
        <p class="sc-meaning" id="scMeaning"></p>
        <div class="sc-supports" id="scSupports"></div>
        <p class="sc-reflection" id="scReflection"></p>
        <button class="solstice-btn sc-draw-again" id="scDrawAgain" style="display:none">draw again</button>
        <div class="sc-divider" style="margin-top:2em"></div>
        <a class="sc-cta" href="apothecary.html">step into the apothecary →</a>
      </div>
    </div>

    <!-- Reveal this when the portal opens: remove display:none and set href -->
    <a class="portal-cta" href="index.html" id="portalCta">follow the light</a>

    <div class="wordmark">Aetherwood</div>

  </div>

  <script>
    /* ——————————————————————————————————————
       MOON PHASE CALCULATOR
       Reference new moon: 16 June 2026 UTC
       Synodic period: 29.53059 days
    —————————————————————————————————————— */
    var REF = Date.UTC(2026, 5, 16, 0, 0, 0);
    var SYNODIC_MS = 29.53059 * 24 * 60 * 60 * 1000;

    function getMoonPhase() {
      var elapsed = ((Date.now() - REF) % SYNODIC_MS + SYNODIC_MS) % SYNODIC_MS;
      var day = elapsed / (24 * 60 * 60 * 1000);
      if (day < 1.85)  return 0; // New Moon
      if (day < 7.38)  return 1; // Waxing Crescent
      if (day < 9.22)  return 2; // First Quarter
      if (day < 14.77) return 3; // Waxing Gibbous
      if (day < 16.61) return 4; // Full Moon
      if (day < 22.15) return 5; // Waning Gibbous
      if (day < 24.00) return 6; // Last Quarter
      return 7;                   // Dark Moon
    }

    var PHASE_NAMES = [
      'New Moon',
      'Waxing Crescent',
      'First Quarter',
      'Waxing Gibbous',
      'Full Moon',
      'Waning Gibbous',
      'Last Quarter',
      'Dark Moon'
    ];

    /* ——————————————————————————————————————
       POEMS
       One array of lines per phase.
       Use '|' for a stanza break.
       Add poems as you write them — null = falls back to New Moon poem.
    —————————————————————————————————————— */
    var POEMS = [
      /* 0 — New Moon */
      [
        'In the stillness',
        'With shadow fallen behind',
        'A light emerges',
        'A glimmer',
        'A promise',
        'Of all that is to come',
        '|',
        'Deep within the woods',
        'A lantern shines',
        'Its steady light',
        'Showing you the way',
        'If you dare to trust',
        '|',
        'Will you step through',
        'Into the warmth',
        'And out of the shadow',
        'To discover what awaits',
        'Beyond the fork in the road?'
      ],
      /* 1 — Waxing Crescent */ null,
      /* 2 — First Quarter   */ null,
      /* 3 — Waxing Gibbous  */ null,
      /* 4 — Full Moon       */ null,
      /* 5 — Waning Gibbous  */ null,
      /* 6 — Last Quarter    */ null,
      /* 7 — Dark Moon       */ null
    ];

    /* ——————————————————————————————————————
       RENDER
    —————————————————————————————————————— */
    var phase = getMoonPhase();
    var poem  = POEMS[phase] || POEMS[0];

    document.getElementById('moonPhase').textContent = PHASE_NAMES[phase];

    var poemEl = document.getElementById('poem');
    poem.forEach(function(line) {
      if (line === '|') {
        var br = document.createElement('span');
        br.className = 'poem-break';
        poemEl.appendChild(br);
      } else {
        var span = document.createElement('span');
        span.className = 'poem-line';
        span.textContent = line;
        poemEl.appendChild(span);
      }
    });
    /* ——————————————————————————————————————
       SOLSTICE FEATURE
       Active: June 18–24 each year
       Litha  = Northern Hemisphere (greeting the light)
       Yule   = Southern Hemisphere (welcoming the dark)
    —————————————————————————————————————— */
    var LITHA_CRYSTALS = [
      {
        worldName:  'Sunbright',
        realName:   'Citrine',
        image:      'https://res.cloudinary.com/ds8pkprtb/image/upload/w_300,h_450,c_fill,g_north,b_white,f_jpg/aetherwood/grimoire/sunbright.png',
        meaning:    'Joy made visible.',
        supports:   ['Confidence', 'Creativity', 'Prosperity', 'Personal power'],
        reflection: 'What light wishes to be shared?'
      },
      {
        worldName:  'Daybringer',
        realName:   'Sunstone',
        image:      'https://res.cloudinary.com/ds8pkprtb/image/upload/w_300,h_450,c_fill,g_north,b_white,f_jpg/aetherwood/grimoire/daybringer.png',
        meaning:    'Radiance and leadership.',
        supports:   ['Self belief', 'Optimism', 'Freedom', 'Action'],
        reflection: 'Where am I ready to shine?'
      }
    ];

    var YULE_CRYSTALS = [
      {
        worldName:  'Emberheart',
        realName:   'Garnet',
        image:      'https://res.cloudinary.com/ds8pkprtb/image/upload/w_300,h_450,c_fill,g_north,b_white,f_jpg/aetherwood/grimoire/emberheart.png',
        meaning:    'The flame that survives the longest night.',
        supports:   ['Courage and inner strength', 'Vitality and life force', 'Passion and motivation', 'Perseverance and endurance'],
        reflection: 'What flame refuses to die?'
      },
      {
        worldName:  'Veilstone',
        realName:   'Smoky Quartz',
        image:      'https://res.cloudinary.com/ds8pkprtb/image/upload/w_300,h_450,c_fill,g_north,b_white,f_jpg/aetherwood/grimoire/veilstone.png',
        meaning:    'Grounding in the quiet dark.',
        supports:   ['Releasing burdens', 'Shadow work', 'Grounding', 'Protection in transition'],
        reflection: 'What must be released before the light returns?'
      }
    ];

    (function() {
      var now   = new Date();
      var month = now.getMonth() + 1;
      var day   = now.getDate();
      if (!(month === 6 && day >= 18 && day <= 24)) return;

      document.getElementById('solsticeSection').style.display = '';

      var currentPool   = null;
      var crystalPanel  = document.getElementById('solsticeCrystal');
      var choicePanel   = document.getElementById('solsticeChoice');

      function drawFrom(pool, seasonLabel) {
        var c = pool[Math.floor(Math.random() * pool.length)];

        document.getElementById('scSeasonLabel').textContent = seasonLabel;
        document.getElementById('scImg').src        = c.image;
        document.getElementById('scImg').alt        = c.worldName;
        document.getElementById('scWorldName').textContent   = c.worldName;
        document.getElementById('scRealName').textContent    = c.realName;
        document.getElementById('scMeaning').textContent     = c.meaning;
        document.getElementById('scReflection').textContent  = '“' + c.reflection + '”';

        var supportsEl = document.getElementById('scSupports');
        supportsEl.innerHTML = '';
        c.supports.forEach(function(s) {
          var chip = document.createElement('span');
          chip.className   = 'sc-support-chip';
          chip.textContent = s;
          supportsEl.appendChild(chip);
        });

        var drawAgain = document.getElementById('scDrawAgain');
        drawAgain.style.display = pool.length > 1 ? '' : 'none';

        crystalPanel.classList.remove('faded');
        crystalPanel.classList.add('visible');
        requestAnimationFrame(function() {
          requestAnimationFrame(function() { crystalPanel.classList.add('faded'); });
        });
      }

      document.getElementById('btnLight').addEventListener('click', function() {
        currentPool = LITHA_CRYSTALS;
        choicePanel.style.display = 'none';
        drawFrom(LITHA_CRYSTALS, 'Litha · summer solstice');
      });

      document.getElementById('btnDark').addEventListener('click', function() {
        currentPool = YULE_CRYSTALS;
        choicePanel.style.display = 'none';
        drawFrom(YULE_CRYSTALS, 'Yule · winter solstice');
      });

      document.getElementById('scDrawAgain').addEventListener('click', function() {
        crystalPanel.classList.remove('faded');
        setTimeout(function() { drawFrom(currentPool, document.getElementById('scSeasonLabel').textContent); }, 150);
      });
    })();
  </script>
</body>
</html>
